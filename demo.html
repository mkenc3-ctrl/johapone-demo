<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>조합ONE 시연 시나리오</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--ink:#1E2124;--ink2:#464C53;--muted:#5F6B75;--line:#D6DCE0;--bd:#B1B8BE;--pri:#0B5563;--pri-s:#E6F1F3;--bg2:#F4F6F8;--acc:#C2410C;--acc-s:#FDEEE6;--gov:#3B4A8A;--gov-s:#ECEEF7;--mem:#1F7A4D;--mem-s:#E5F3EA}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg2);color:var(--ink);font:15px/1.6 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;word-break:keep-all}
.wrap{display:grid;grid-template-columns:400px minmax(0,1fr);height:100vh}
.side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.top{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:20px}
.top p{margin:4px 0 0;color:var(--ink2);font-size:13.5px}
.prog{height:4px;background:var(--bg2);border-radius:2px;margin-top:12px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--pri);transition:width .2s}
.steps{flex:1;overflow:auto;padding:10px 12px 16px}
.part{font-size:12.5px;font-weight:700;color:var(--muted);margin:14px 6px 6px;letter-spacing:.02em}
.st{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer;font:inherit;color:inherit}
.st:hover{border-color:var(--bd)}
.st.on{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-s)}
.st b{display:block;font-size:14.5px}
.st .who{display:inline-block;font-size:11.5px;font-weight:700;border-radius:4px;padding:0 6px;line-height:1.8;margin-right:6px}
.w-gov{background:var(--gov-s);color:var(--gov)}.w-admin{background:var(--acc-s);color:var(--acc)}.w-hong{background:var(--mem-s);color:var(--mem)}.w-end{background:var(--pri-s);color:var(--pri)}
.say{display:none;margin-top:8px;font-size:13.5px;color:var(--ink2)}
.st.on .say{display:block}
.say ul{margin:6px 0 0;padding-left:18px}
.say .law{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
.foot{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.btn{flex:1;height:42px;border-radius:8px;border:1px solid var(--bd);background:#fff;font:inherit;font-weight:700;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.view{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--ink2)}
.bar b{color:var(--ink)}
.bar a{margin-left:auto;color:var(--pri);font-weight:700;text-decoration:none;white-space:nowrap}
.frame{flex:1;display:flex;justify-content:center;align-items:stretch;padding:14px;min-height:0}
iframe{width:100%;height:100%;border:1px solid var(--line);border-radius:12px;background:#fff}
.frame.phone iframe{width:390px;max-width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:4px 10px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#fff}
.sum{margin-top:10px;border-radius:8px;background:var(--bg2);padding:10px 12px}
.sum b{font-size:22px;color:var(--acc)}
@media (max-width:900px){
  .wrap{display:block;height:auto}
  .side{border-right:0;min-height:100vh}
  .view{display:none}
  .steps{overflow:visible}
  .foot{position:sticky;bottom:0;background:#fff}
}
</style>
</head>
<body>
<div class="wrap">
  <aside class="side">
    <div class="top">
      <h1>조합ONE 시연 시나리오</h1>
      <p>시·구청 담당자 → 조합장 → 조합원 순서로 약 10분. 단계를 누르면 오른쪽에 해당 화면이 열립니다.</p>
      <div class="prog"><i id="prog"></i></div>
    </div>
    <div class="steps" id="steps"></div>
    <div class="foot"><button class="btn" id="prev">‹ 이전</button><button class="btn pri" id="next">다음 ›</button></div>
  </aside>
  <section class="view">
    <div class="bar"><span id="who"></span><b id="ttl"></b><div class="seg" id="dev"><button class="on" data-d="pc">PC</button><button data-d="phone">휴대폰</button></div><a id="open" target="_blank" rel="noopener">새 창으로 ↗</a></div>
    <div class="frame" id="frame"><iframe id="app" title="조합ONE 화면"></iframe></div>
  </section>
</div>
<script>
  // 시연 단계: [대상, 계정, 화면(hash), 제목, 설명 문단, 강조점, 근거]
  var U = 'demo-oo1';
  var WHO = { gov: ['w-gov', '시·구 담당자'], admin: ['w-admin', '조합장'], hong: ['w-hong', '조합원'], end: ['w-end', '정리'] };
  var STEPS = [
    ['gov', 'gov', '#home', '관할 조합을 한 화면에서', '조합ONE을 쓰는 관할 조합의 현황이 실시간으로 모입니다.', ['정보공개 지연·임원 교육 미이수·입찰 보완 필요 건수를 조합별로 표시', '담당자는 열람만 가능 (수정·삭제 불가)'], '법 제111조(자료의 제출)·제113조(감독) 업무 지원'],
    ['gov', 'gov', '#gdisc', '정보공개 15일 기한 자동 점검', '조합이 자료를 작성·변경한 날부터 15일 공개 기한을 자동 계산해 초과·임박 순으로 보여줍니다.', ['민원이 들어오기 전에 지연을 먼저 확인', '조합별 원문 바로 열람'], '법 제124조 (15일 이내 공개)'],
    ['gov', 'gov', '#gedu', '임원 교육 이수 관리', '조합임원은 선임 후 6개월 이내 12시간 교육을 받아야 하고, 지자체는 참여 현황을 관리해야 합니다.', ['임원별 이수 기한·인정 시간·상태 자동 계산', '기한 초과·임박 임원을 관할 전체에서 한 번에'], '시행령 제90조 (제4항 지자체 관리)'],
    ['gov', 'gov', '#bids', '입찰공고 법정 요건 점검', '조합의 협력업체·시공자 선정 입찰이 계약 방식·금액 기준에 맞는지 자동 점검합니다.', ['수의계약·지명경쟁 금액 한도, 전자조달 의무', '시공자: 조합설립인가 후, 2회 유찰, 합동설명회 2회'], '법 제29조, 시행령 제24조'],
    ['admin', 'admin', '#home', '조합 사무국 대시보드', '조합장·사무국은 처리할 일과 비용 절감 효과를 첫 화면에서 봅니다.', ['동의율·투표 참여·신분증 미제출 등 핵심 숫자', '처리할 일: 문의, 공개 대기, 교육 기한, 서면결의서 미제출'], ''],
    ['admin', 'admin', '#meetset', '총회 설정과 소집통지', '총회 일시·전자의결 기간·안건을 정하면 소집통지문이 자동으로 만들어지고 알림톡으로 보냅니다.', ['안건 종류에 따라 필요한 직접출석 인원 자동 안내', '등기우편 건당 약 3,000원 → 알림톡 건당 약 15원 (예시 단가)'], '시행령 제42조 제2항 (전자의결 방법·기간 통지)'],
    ['admin', 'admin', '#vote', '전자투표와 성원·의결 점검', '개표 전에는 찬반 집계를 누구도 볼 수 없고, 참여 인원만 보입니다. 현장·대리인·온라인 출석을 합쳐 성원을 판정합니다.', ['의사정족수(조합원 과반수 출석)와 직접출석 10%·20%·과반수 요건', '개표 후 안건별 가결·부결 자동 판정, 서면·전자·현장 구분 집계'], '법 제45조, 제44조의2, 시행령 제42조'],
    ['admin', 'admin', '#consent', '전자동의서', '추진위 구성·조합설립 동의를 휴대폰으로 받고, 사업 유형별 법정 요건 대비 동의율을 실시간으로 봅니다.', ['재개발 3/4, 재건축 동별 과반+70% 등 요건 자동 적용', '철회 가능 기간 판정과 철회서 접수'], '법 제35조·제36조, 시행령 제33조'],
    ['admin', 'admin', '#roster', '조합명부관리', '조합원 명부, 신분증·서면결의서 제출, 연번, 소유권 변동을 한 곳에서 관리합니다.', ['주민번호 기본 마스킹, 원본 열람 시 사유 기록', '매매·상속 변동 시 조합원 자격 제한 자동 점검'], '시행령 제97조, 법 제39조·제129조'],
    ['hong', 'hong', '#vote', '조합원: 휴대폰으로 투표', '조합원은 앱에서 본인 명의로 안건별 찬반을 선택해 제출합니다.', ['서면결의서 우편·방문 회수가 필요 없음', '서면 방법도 함께 보장 (병행)'], '법 제45조 제6항'],
    ['hong', 'hong', '#assembly', '조합원: 온라인총회 입장', '총회 당일 「입장하기」로 참석하면 직접 출석으로 인정됩니다. 접속 기록이 남습니다.', ['총회장 대관·인력 축소', '먼 곳에 사는 조합원도 참석'], '법 제44조의2 제2항'],
    ['hong', 'hong', '#cafe', '조합원: 모임방·소식', '조합원만 들어오는 카페형 소통 공간. 허가받은 조합원만 글을 쓸 수 있습니다.', ['공지·자료·사진·PDF 공유', '정보공개 자료와 일정도 앱 하나에서'], ''],
    ['end', null, null, '정리: 비용 절감과 원스톱', '', [], '']
  ];
  var cur = 0, dev = 'pc';
  function url(s) { return 'union.html?u=' + U + '&as=' + s[1] + s[2]; }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function body(s, i) {
    if (s[0] === 'end') return '<div class="say"><div class="sum">조합원 1,000명 · 총회 1회 기준 (예시 단가)<br>총회 한 번에 약 <b>6,236만원</b> 절감</div>' +
      '<ul><li>등기우편 → 알림톡, 서면결의서 징구 인력 → 전자투표</li><li>동의서 방문 회수 → 전자동의서, 총회장 대관 → 온라인총회</li><li>시·구청: 관할 조합 점검을 한 시스템에서 (서버 이용료만 부담)</li><li>조합: 필요한 유료 카테고리만 건별 이용 (구독 없음)</li></ul>' +
      '<p style="margin:10px 0 0"><a href="report.html" target="_blank" rel="noopener">조합별 맞춤 절감 리포트 만들기 ↗</a> · <a href="platform.html" target="_blank" rel="noopener">홈페이지 ↗</a></p></div>';
    return '<div class="say">' + esc(s[4]) + (s[5].length ? '<ul>' + s[5].map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '') + (s[6] ? '<span class="law">근거: ' + esc(s[6]) + '</span>' : '') +
      '<p class="mob" style="margin:8px 0 0"><a href="' + url(s) + '" target="_blank" rel="noopener">이 화면 열기 ↗</a></p></div>';
  }
  function draw() {
    var html = '', part = '';
    STEPS.forEach(function (s, i) {
      var w = WHO[s[0]];
      if (w[1] !== part) { part = w[1]; html += '<div class="part">' + (s[0] === 'gov' ? '1. ' : s[0] === 'admin' ? '2. ' : s[0] === 'hong' ? '3. ' : '') + part + (s[0] === 'gov' ? ' · 김주무관' : s[0] === 'admin' ? ' · 박정수' : s[0] === 'hong' ? ' · 홍길동' : '') + '</div>'; }
      html += '<button class="st' + (i === cur ? ' on' : '') + '" data-i="' + i + '"><b><span class="who ' + w[0] + '">' + (i + 1) + '</span>' + esc(s[3]) + '</b>' + body(s, i) + '</button>';
    });
    document.getElementById('steps').innerHTML = html;
    document.getElementById('prog').style.width = ((cur + 1) / STEPS.length * 100) + '%';
    document.getElementById('prev').disabled = cur === 0;
    document.getElementById('next').disabled = cur === STEPS.length - 1;
    var s = STEPS[cur], w = WHO[s[0]];
    document.getElementById('who').innerHTML = '<span class="who ' + w[0] + '" style="font-size:12px;font-weight:700;border-radius:4px;padding:2px 7px">' + w[1] + '</span>';
    document.getElementById('ttl').textContent = s[3];
    var op = document.getElementById('open'), fr = document.getElementById('app');
    if (s[1]) { op.href = url(s); op.style.visibility = 'visible'; if (fr.dataset.src !== url(s)) { fr.dataset.src = url(s); fr.src = url(s); } }
    else { op.style.visibility = 'hidden'; if (fr.dataset.src !== 'platform.html') { fr.dataset.src = 'platform.html'; fr.src = 'platform.html'; } }
    var on = document.querySelector('.st.on'); if (on && window.innerWidth > 900) on.scrollIntoView({ block: 'nearest' });
  }
  document.getElementById('steps').addEventListener('click', function (e) {
    if (e.target.closest('a')) return;
    var b = e.target.closest('.st'); if (!b) return; cur = +b.dataset.i; draw();
  });
  document.getElementById('prev').onclick = function () { if (cur > 0) { cur--; draw(); } };
  document.getElementById('next').onclick = function () { if (cur < STEPS.length - 1) { cur++; draw(); } };
  document.addEventListener('keydown', function (e) { if (e.key === 'ArrowRight' || e.key === 'PageDown') document.getElementById('next').click(); if (e.key === 'ArrowLeft' || e.key === 'PageUp') document.getElementById('prev').click(); });
  document.getElementById('dev').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return; dev = b.dataset.d;
    [].forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); });
    document.getElementById('frame').classList.toggle('phone', dev === 'phone');
  });
  draw();
</script>
</body>
</html>
