<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>재건축 절차 체크리스트</title>
<style>
  /* 왼쪽에 단계 목록, 오른쪽에 그 단계의 할 일 카드. 폰에서는 단계 목록이 가로로 넘겨 보는 줄이 된다. */
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1f23; --muted: #6b7078; --line: #e2e0d9;
    --accent: #1f5f8b; --accent-soft: #e6eff5; --warn: #9a4a12; --warn-soft: #fbeee0; --ok: #2f7a4d; --ok-soft: #e3f2e8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181c; --panel: #1e2126; --ink: #e8e9eb; --muted: #9499a1; --line: #2e3238;
      --accent: #7db8de; --accent-soft: #23323d; --warn: #e3a86c; --warn-soft: #3a2a1b; --ok: #7fc79a; --ok-soft: #1f3327; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16181c; --panel: #1e2126; --ink: #e8e9eb; --muted: #9499a1; --line: #2e3238;
    --accent: #7db8de; --accent-soft: #23323d; --warn: #e3a86c; --warn-soft: #3a2a1b; --ok: #7fc79a; --ok-soft: #1f3327; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.7 "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 3; }
  .top { max-width: 1180px; margin: 0 auto; display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; }
  #proj { font: inherit; font-size: 16px; color: var(--ink); background: var(--panel); border: 1px solid var(--accent); border-radius: 8px; padding: 6px 8px; max-width: 220px; }
  #pname { flex: 1; min-width: 160px; font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .bar { flex-basis: 100%; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--ok); width: 0; }
  .total { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1180px; margin: 0 auto; display: flex; gap: 20px; padding-inline: 16px; padding-block: 16px 60px; align-items: flex-start; }
  nav { width: 260px; flex: none; position: sticky; top: 96px; display: flex; flex-direction: column; gap: 4px; }
  nav button { font: inherit; font-size: 14px; text-align: left; padding: 8px 10px; border-radius: 8px; border: 1px solid transparent; background: none; color: var(--ink); cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
  nav button:hover { background: var(--accent-soft); }
  nav button[aria-current="true"] { background: var(--panel); border-color: var(--accent); font-weight: 600; }
  nav .n { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; font-variant-numeric: tabular-nums; }
  nav .n.full { color: var(--ok); font-weight: 700; }
  main { flex: 1; min-width: 0; }
  h2 { font-size: 20px; margin: 0 0 4px; text-wrap: balance; }
  .lead { color: var(--muted); margin: 0 0 16px; }
  .step { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; margin-bottom: 14px; }
  .step h3 { font-size: 16px; margin: 0 0 2px; }
  .who { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
  .req { background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; margin: 8px 0; font-size: 14px; }
  .req b, .warn b { display: block; font-size: 12.5px; letter-spacing: .02em; }
  .req b { color: var(--accent); }
  .warn { background: var(--warn-soft); border-radius: 8px; padding: 8px 12px; margin: 8px 0; font-size: 14px; }
  .warn b { color: var(--warn); }
  .warn ul { margin: 2px 0 0; padding-left: 1.2em; }
  .checks { list-style: none; margin: 6px 0; padding: 0; }
  .checks li { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
  .checks li:last-child { border-bottom: 0; }
  .checks input { width: 18px; height: 18px; margin-top: 4px; flex: none; accent-color: var(--ok); }
  .checks label { flex: 1; min-width: 0; overflow-wrap: anywhere; cursor: pointer; }
  .checks input:checked + label { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
  .dates { display: grid; gap: 8px; margin: 10px 0; }
  .dates label { font-size: 13.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .dates input { font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }
  .dl { margin: 0; padding: 0; list-style: none; font-size: 14px; }
  .dl li { padding: 3px 0; }
  .dl .d { font-weight: 700; font-variant-numeric: tabular-nums; }
  .dl .late { color: var(--warn); }
  .refs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
  .refs span { font-size: 12.5px; color: var(--muted); }
  .chip { font: inherit; font-size: 13px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--accent); cursor: pointer; }
  .chip[aria-expanded="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }
  .art { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; margin-top: 8px; font-size: 14px; }
  .art h4 { margin: 0 0 4px; font-size: 14px; }
  .art p { margin: 2px 0; overflow-wrap: anywhere; }
  .art a { color: var(--accent); font-size: 13px; }
  .lv1 { padding-left: 1.4em; } .lv2 { padding-left: 2.8em; } .lv3 { padding-left: 4.2em; }
  textarea { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 10px; resize: vertical; }
  .pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .btn { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  .btn.pri { background: var(--accent); border-color: var(--accent); color: var(--panel); }
  .foot { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); margin-top: 26px; padding-top: 12px; }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .tools .btn { padding: 5px 12px; font-size: 13.5px; }
  #msg { font-size: 13px; color: var(--muted); flex-basis: 100%; }
  .easy { margin: 2px 0 8px; font-size: 15px; }
  .roles { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 14px; }
  .roles th, .roles td { text-align: left; vertical-align: top; padding: 5px 8px; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
  .roles th { width: 30%; font-weight: 600; color: var(--accent); }
  .roles caption { text-align: left; font-size: 12.5px; color: var(--muted); padding-bottom: 2px; }
  .info h3 { font-size: 16px; margin: 0 0 6px; }
  .info ol, .info dl { margin: 0; padding-left: 1.3em; }
  .info dl { padding-left: 0; }
  .info dt { font-weight: 600; margin-top: 8px; }
  .info dd { margin: 0; color: var(--muted); }
  .tablewrap { overflow-x: auto; }
  .big th { width: 22%; }
  .more { border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; margin: 10px 0; }
  .more summary { cursor: pointer; color: var(--accent); font-weight: 600; }
  .more h4 { font-size: 13.5px; margin: 10px 0 2px; color: var(--muted); }
  .more ol, .more ul { margin: 2px 0; padding-left: 1.4em; }
  .more a { color: var(--accent); }
  .gate { max-width: 420px; }
  .gate input, .lock input { font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; margin: 4px 0 8px; }
  #print { display: none; }
  @media print {
    header, .wrap { display: none !important; }
    body { background: #fff; color: #000; }
    #print { display: block; }
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  @media (max-width: 820px) {
    .wrap { display: block; }
    nav { position: static; width: auto; flex-direction: row; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; }
    nav button { flex: none; white-space: nowrap; }
    h1 { font-size: 15px; }
  }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>재건축 절차 체크리스트</h1>
    <select id="proj" aria-label="사업장 선택"></select>
    <input id="pname" type="text" placeholder="단지 이름 (예: ○○아파트 재건축)" autocomplete="off">
    <span class="total" id="total"></span>
    <div class="tools">
      <button class="btn" id="btnPrint">인쇄</button>
      <button class="btn" id="btnNew">사업장 추가</button>
      <button class="btn" id="btnExport">저장</button>
      <button class="btn" id="btnImport">불러오기</button>
      <button class="btn pri" id="btnLock">비밀번호 잠금 설정</button>
      <input type="file" id="importFile" accept=".html,.htm,.json" hidden>
    </div>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    <span id="msg" role="status"></span>
  </div>
</header>
<div class="wrap">
  <nav id="nav" aria-label="단계"></nav>
  <main id="main"></main>
</div>
<div id="print"></div>

<script src="data.js"></script>
<script>
(function () {
  var SRC = document.currentScript.textContent;
  var PHASES, PLAYERS, TERMS, HOWTO, FORMMAP, SHEETMAP, SHEETS;
  // 아래 내용 구간은 잠금 버전을 만들 때 통째로 암호화되어 빠진다.
  /*CONTENT-START*/
  // 조문 표기: A=법, D=시행령, R=시행규칙. 'A29-2' = 법 제29조의2
  PHASES = [
    { t: '전 단계 공통 준수사항', lead: '어느 단계에서든 계속 지켜야 하는 의무입니다. 위반하면 형사처벌이나 인가 취소로 이어지는 항목이 많으니 먼저 읽어 두세요.', steps: [
      { id: 'c1', t: '자료 공개와 열람·복사', who: '추진위원장 · 조합임원(정비업체가 실무 대행)',
        checks: ['서류가 작성·변경되면 15일 이내에 인터넷과 그 밖의 방법을 함께 써서 공개한다 (운영규정·정관, 용역업체 선정계약서, 의사록, 사업시행계획서, 관리처분계획서, 공문서, 회계감사보고서, 월별 자금 입출금 내역, 자금차입 신고사항, 결산보고서 등)',
          '시행령이 추가로 정한 자료도 공개한다: 분양공고·분양신청 사항, 연간 자금운용 계획, 월별 공사 진행, 용역업체와의 세부 계약 변경, 정비사업비 변경',
          '매 분기가 끝나는 달의 다음 달 15일까지 공개 대상 목록·개략적 내용·공개 장소·열람·복사 방법을 조합원(토지등소유자)에게 서면으로 통지한다',
          '조합원·토지등소유자의 열람·복사 요청은 15일 이내에 응한다 (토지등소유자 명부, 조합원 명부 포함)',
          '공개·열람 자료에서 주민등록번호는 제외한다',
          '공개일·통지일·열람 요청 접수일과 처리일을 대장으로 남긴다'],
        warn: ['공개 의무와 열람·복사 의무 위반은 조합임원 개인이 벌칙(제138조) 대상이 됩니다. 실제 기소 사례가 가장 많은 유형입니다.', '15일은 작성·변경일 또는 요청일부터 셉니다. 총회 직후 의사록, 계약 직후 계약서가 자주 누락됩니다.'],
        refs: ['A124', 'A125', 'A138', 'D94'] },
      { id: 'c2', t: '총회 소집과 의결 요건', who: '조합장 · 조합 사무국',
        checks: ['안건이 총회 의결사항(제45조 제1항)인지, 대의원회가 대행할 수 없는 사항인지 먼저 확인한다',
          '총회 7일 전까지 목적·안건·일시·장소와 서면·전자 의결권 행사 기간·장소를 조합원에게 통지한다 (정관에 더 긴 기간이 있으면 정관에 따른다)',
          '일반 안건: 조합원 과반수 출석 + 출석 조합원 과반수 찬성',
          '사업시행계획·관리처분계획 수립·변경: 조합원 과반수 찬성 (정비사업비가 10% 이상 늘면 조합원 3분의 2 이상 찬성)',
          '직접 출석 요건: 일반 총회 조합원 10% 이상, 창립총회·사업시행계획·관리처분계획 등 총회 20% 이상, 시공자 선정 총회 과반수',
          '서면·전자 의결권 행사자의 본인 여부를 확인하고 기록을 남긴다',
          '전자 의결을 쓸 때는 서면 등 다른 방법도 함께 열어 두고, 방법별 결과를 구분해 관리한다',
          '온라인총회를 병행하려면 그 자체를 총회에서 의결해 둔다'],
        req: '조합임원 해임은 조합원 10분의 1 이상 요구로 소집된 총회에서 조합원 과반수 출석, 출석 조합원 과반수 동의로 할 수 있습니다 (제43조 제4항).',
        warn: ['직접 출석 인원 미달, 통지 기간 부족, 서면결의서 본인확인 누락은 총회결의 무효 소송의 단골 쟁점입니다.', '서면결의서를 홍보요원이 걷는 과정에서 금품 제공·대리 작성 문제가 생기지 않도록 절차를 문서화하세요.'],
        refs: ['A44', 'A44-2', 'A45', 'A46', 'A43', 'D42', 'D43'] },
      { id: 'c3', t: '자금 차입 · 예산 · 회계감사', who: '조합(추진위원회)',
        checks: ['자금 차입과 그 방법·이자율·상환방법은 총회 의결을 거친다',
          '자금을 차입하면 대여자·차입액·이자율·상환방법을 시장·군수등에게 신고한다',
          '정비사업비 세부 항목별 사용계획이 담긴 예산안과 사용내역을 총회에서 의결한다',
          '예산에 없는데 조합원에게 부담이 되는 계약은 체결 전에 총회 의결을 받는다',
          '회계감사 대상 시점 세 가지를 일정표에 넣는다: 추진위→조합 인계 전, 사업시행계획인가 고시 후, 준공인가 신청 후',
          '토지등소유자 또는 조합원 5분의 1 이상이 요청하면 회계감사를 받는다'],
        warn: ['총회 의결 없이 조합원에게 부담이 되는 계약을 체결하면 임원이 벌칙 대상이 되고 계약 효력도 다퉈집니다.'],
        refs: ['A45', 'A111-2', 'A112', 'A137'] },
      { id: 'c4', t: '계약 방법과 금품·홍보 규제', who: '추진위원장 · 조합 · 입찰 참여 업체',
        checks: ['공사·용역·물품 계약은 일반경쟁입찰이 원칙이다. 지명경쟁·수의계약은 시행령이 정한 경우에만 한다',
          '시행령이 정한 규모를 넘는 계약은 전자조달시스템(누리장터)을 이용한다',
          '국토교통부 고시 「정비사업 계약업무 처리기준」의 절차(입찰공고 기간, 현장설명, 대의원회·총회 상정 등)를 따른다',

        warn: ['금품·향응 제공과 수수는 양쪽 모두 처벌되고, 시공자 선정 취소·과징금(제113조의2)과 입찰참가 제한(제113조의3)으로 이어집니다.', '정비업체 임직원은 벌칙 적용에서 공무원으로 의제됩니다(제134조). 뇌물죄가 적용될 수 있습니다.'],
        refs: ['A29', 'A132', 'A132-2', 'A132-3', 'A113-2', 'A113-3', 'A134', 'A135', 'D24'] },

    c2: ['안건을 먼저 표로 만든다: 안건명, 근거 조문, 필요한 찬성 수, 필요한 직접 출석 비율.', '총회일에서 거꾸로 계산해 통지 발송일을 정한다. 우편 도달 시간을 고려해 법정 기한보다 일주일 이상 앞서 보낸다.', '서면결의서와 전자투표는 본인확인 방법을 통지문에 적고, 접수 순서대로 번호를 매겨 보관한다.', '당일에는 참석자 명부에 서명을 받고, 직접 출석·서면·전자·대리를 따로 센다. "총회 집계표" 엑셀 양식을 쓴다.', '끝나면 의사록과 속기록을 만들고 15일 안에 공개한다.'],
    c3: ['연초에 예산안을 세워 총회 의결을 받는다. 항목별로 금액과 쓰임을 적는다.', '돈을 빌릴 때는 먼저 총회에서 차입처·금액·이자율·상환방법을 의결하고, 빌린 뒤 구청에 신고한다.', '월말마다 입출금 내역을 정리해 공개한다. 통장 사본과 증빙을 붙여 둔다.', '회계감사 시점이 오면 구청에 감사인 선정을 요청하고 비용을 예치한다. 조합이 직접 감사인을 고르지 않는다.'],
    c4: ['계약할 일이 생기면 먼저 추정가격을 내고 "계약 방식" 표에서 입찰 방법을 정한다.', '입찰공고문에 금지 사항(금품 제공, 개별 홍보, 시공과 무관한 제안)과 위반 시 입찰 무효를 명시한다.', '임직원, 홍보요원, 입찰 참여 업체에게 청렴 서약서를 받는다.', '업체 직원이 조합원 집을 개별 방문한다는 제보가 오면 일시와 내용을 기록하고 신고센터에 알린다.'],
    c6: ['사업 전체 일정표에 업체 선정 시점을 표시한다: 정비업체·설계자 → 시공자 → 감정평가법인 → 그 밖의 용역.', '각 계약마다 "누가 의결하는가"를 먼저 확인한다. 헷갈리면 총회에 올리는 쪽이 안전하다.', '계약서에 서명하기 전에 의결 의사록이 있는지 확인하고, 계약 후 15일 안에 계약서를 공개한다.', '모든 계약을 "계약 대장" 엑셀 양식에 한 줄씩 적는다.'],
    c7: ['견적을 2~3곳에서 받아 추정가격을 정하고 산정 근거를 남긴다.', '추정가격이 표의 기준을 넘는지 확인한다. 애매하면 일반경쟁입찰로 한다.', '전자조달 대상이면 누리장터에 조합을 수요기관으로 등록하고 공고한다. 등록에 시간이 걸리므로 미리 해 둔다.', '유찰되면 유찰 사실을 문서로 남기고 재공고한다. 2회 유찰된 뒤에만 수의계약을 검토한다.'],
    c8: ['연간 달력에 통지 일정을 미리 넣는다: 분기 통지(1·4·7·10월), 총회 통지, 단계별 법정 통지.', '통지문은 등기우편으로 보내고 영수증을 "통지 발송 대장"에 붙인다.', '반송된 우편은 주소를 다시 확인해 재발송하고, 끝내 닿지 않으면 정관이 정한 방법(게시, 공고 등)을 따른다.', '조합원 소식지에 "집을 팔거나 세놓을 때 설명해야 할 사항"을 정기적으로 싣는다.'],
    c5: ['등록증과 기술인력 현황을 사업장에 비치하고 변경이 있으면 변경등록한다.', '계약서의 업무 범위가 법이 정한 위탁 업무 안에 있는지 확인한다.', '같은 사업에서 철거·설계·시공 등 겸할 수 없는 업무를 계열사를 통해서도 하지 않는지 점검한다.'],
    s1: ['관리사무소와 등기소에서 동·호별 소유자 현황을 확인해 "토지등소유자 명부" 엑셀 양식을 채운다.', '구청 담당 부서를 방문해 우리 단지가 정비예정구역인지, 정비계획 수립 시기가 언제인지 묻는다.', '상가 소유자 모임과 일찍 만나 요구 사항을 듣는다.', '주민 설명회를 열어 재건축 의사를 확인하고 연락처 수집 동의를 받는다.'],
    s2: ['구청에서 요청 절차와 예상 비용을 확인한다.', '공식 서식 "재건축진단 요청서"를 내려받아 작성하고, 소유자 10분의 1 이상의 동의서를 붙인다.', '비용을 누가 어떻게 낼지(모금, 추진위 차입 등) 미리 정하고 기록한다.', '결과보고서를 받으면 사본을 보관하고 주민에게 요지를 알린다.'],
    s3a: ['구청 담당자와 사전 협의해 입안 요청과 입안 제안 중 어느 쪽이 가능한지 확인한다.', '동의서 서식과 필요한 동의율을 구청과 조례에서 확인한 뒤 받기 시작한다.', '정비계획(안)은 도시계획 업체나 설계자가 작성한다. 주민 요구(세대수, 평형, 층수)를 정리해 전달한다.', '접수증을 받고 접수일을 메모 칸에 적는다.'],
    s3b: ['주민설명회와 공람 일정을 주민에게 따로 안내한다.', '공람 기간에 낼 의견을 모아 서면으로 제출하고 접수증을 받는다.', '심의에서 보완 요구가 나오면 설계자·도시계획 업체와 함께 보완 서류를 낸다.', '지정·고시가 나면 공보에서 고시문을 내려받아 보관하고 고시일을 날짜 칸에 넣는다.'],
    s4a: ['추진위원 후보를 모으고 결격사유가 없는지 확인 서류를 받는다.', '공식 서식 "추진위원회 구성동의서"를 구청에서 검인받아 그 서식으로만 동의를 받는다.', '동의를 받을 때 조합설립 동의로도 본다는 점을 설명하고, 설명을 들었다는 확인을 받는다.', '받은 동의서는 번호를 매겨 명부와 대조하고, 과반수가 되면 "승인신청서"와 함께 구청에 낸다.'],
    s4b: ['승인서를 받으면 고시 내용을 확인하고 사무실을 연다.', '운영규정에 따라 첫 회의를 열어 업무 계획과 예산을 정한다.', '정비업체와 설계자 입찰을 공고한다. 금액 기준과 전자조달 대상 여부를 먼저 확인한다.', '회계장부를 첫날부터 쓴다. 나중에 조합에 그대로 넘겨야 한다.'],
    s5a: ['정관(안)과 추정분담금 자료를 먼저 완성한다. 이 자료 없이 동의서를 받지 않는다.', '공식 서식 "조합설립 동의서"를 구청에서 검인받는다.', '동별로 담당자를 정해 동의서를 받고, 매주 "동별 동의율 집계표"를 갱신한다.', '동의율이 낮은 동과 상가는 따로 설명회를 연다.', '철회서나 반대 의사표시가 들어오면 접수일을 적고 집계에서 뺀다.'],
    s5b: ['시행령이 정한 소집 방법과 통지 기간을 확인해 창립총회를 공고·통지한다.', '임원 후보 등록을 받고 자격(소유 기간, 거주 기간)과 결격사유 증빙을 확인한다.', '직접 출석 20% 이상이 되도록 참석을 독려하고, 참석자 명부에 서명을 받는다.', '정관 확정과 임원 선임 결과를 의사록에 적어 15일 안에 공개한다.'],
    s5c: ['공식 서식 "조합설립 인가신청서"에 정관, 동의서, 창립총회 의사록 등을 붙여 구청에 낸다.', '인가서를 받으면 30일 안에 법무사를 통해 설립등기를 한다.', '세무서에 사업자등록을 하고 조합 명의 통장을 만든다.', '추진위원회 장부와 서류를 30일 안에 넘겨받고 인계인수서를 쓴다.'],
    s6a: ['이사회와 대의원회에서 입찰 방법과 일정을 정하고 입찰공고를 낸다.', '현장설명회를 열고, 제안서를 받으면 조건을 한 장 비교표로 만든다.', '금지된 제안이 있는지 변호사와 함께 검토한다.', '합동설명회를 2회 이상 열고 일시·참석자를 기록한다.', '총회에서 조합원 과반수가 직접 출석한 상태로 투표하고, 계약서에 철거와 시공보증을 넣는다.'],
    s6b: ['계약금액과 증액 요청액을 표로 정리해 누적 증액 비율을 계산한다.', '요건에 해당하면 시공자에게 증액 근거 자료를 받아 지원기구에 검증을 신청한다.', '검증 결과를 조합원에게 알린 뒤에 증액 안건을 총회에 올린다.'],
    s7a: ['설계자와 평형 구성, 세대수, 배치를 정한다. 조합원 선호도 조사를 먼저 한다.', '구청과 사전 협의해 통합심의 대상과 필요한 평가서를 확인한다.', '정비사업비 추산액을 항목별로 정리한다. 이 숫자가 이후 증가율 판단의 기준이 된다.'],
    s7b: ['안건 자료를 쉬운 말로 요약해 통지문에 넣는다 (세대수, 평형, 사업비, 예상 분담금).', '전체 조합원 과반수 찬성이 필요하므로 서면·전자 의결 참여를 적극 안내한다.', '직접 출석 20% 이상을 확인하고 의사록을 만든다.'],
    s7c: ['공식 서식 "사업시행계획 인가신청서"에 계획서와 총회 의사록 등을 붙여 낸다.', '공람 기간에 들어온 의견과 구청의 보완 요구에 답한다.', '인가 고시가 나면 고시일을 날짜 칸에 넣어 회계감사·매도청구·분양통지 기한을 확인한다.'],
    s8a: ['조합설립에 동의하지 않은 사람의 명단을 등기부와 대조해 확정한다.', '변호사가 작성한 촉구서를 내용증명과 배달증명으로 보낸다.', '도달일을 "매도청구 대상자 관리표"에 넣으면 회답 기한과 청구 기한이 계산된다.', '회답 기한이 지나면 곧바로 소장을 접수한다. 마지막 주까지 미루지 않는다.'],
    s8b: ['총회에서 조합 몫의 감정평가법인을 선정한다.', '구청에 감정평가법인 선정을 요청하고 비용을 예치한다.', '평가에 필요한 자료(소유자 명부, 면적, 도면)를 넘기고, 결과가 나오면 조합원별 통지 자료로 정리한다.'],
    s8c: ['통지서에 넣을 내용을 점검표로 확인한다: 종전자산 가격, 분담금 추산액, 신청 기간, 신청하지 않으면 현금청산된다는 안내.', '통지서를 등기우편으로 보내고 같은 내용을 일간신문에 공고한다.', '신청서를 받으면 "분양신청 접수 대장"에 접수일과 신청 평형을 적는다.', '마감 일주일 전에 미신청자에게 다시 안내한다.'],
    s9a: ['분양신청 결과를 평형별로 집계한다.', '정관과 법의 기준에 따라 평형 배정 순위를 정한다.', '조합원별 권리가액, 분양가, 분담금을 계산한 표를 만든다.', '현금청산 대상자 명단을 따로 정리한다.'],
    s9b: ['총회일을 먼저 정하고 날짜 칸에 넣어 1개월 전 통지 기한을 확인한다.', '조합원별 통지문에 본인의 종전자산 가격, 분양 예정 자산, 분담금을 넣어 등기우편으로 보낸다.', '총회 의결 후 30일 이상 공람한다. 공람 장소와 기간을 통지하고 의견서를 받는다.'],
    s9c: ['공식 서식 "관리처분계획 인가신청서"에 계획서, 총회 의사록, 공람 결과를 붙여 낸다.', '타당성 검증 대상이면 기간이 60일로 늘어나므로 이주 일정을 그에 맞춘다.', '고시일을 날짜 칸에 넣어 현금청산 협의 기한과 소송 기한을 확인한다.'],
    s10a: ['대상자별로 협의 일정을 잡고 감정평가액을 근거로 금액을 제시한다.', '만날 때마다 일시와 내용을 "현금청산 협의 기록" 엑셀 양식에 적는다.', '협의 기한 안에 합의가 안 되면 60일 안에 소송을 낸다. 기한을 넘기면 지연이자가 붙는다.'],
    s10b: ['이주 기간을 공고하고 조합원·세입자에게 개별 안내한다.', '세입자 보증금 반환 요청에 대비해 재원을 마련한다.', '이주가 끝난 세대는 출입을 막고 범죄예방 순찰을 돌린다.', '철거 전에 석면 조사를 마치고, 철거가 제한되는 시간과 날씨를 시공자에게 알린다.'],
    s10c: ['시공보증서를 받아 착공신고 서류에 붙인다.', '일반분양 일정을 시공자·분양대행사와 정하고 구청 승인을 받는다.', '공사 중 설계 변경이나 공사비 증액 요청이 오면 공사비 검증 요건부터 계산한다.'],
    s11: ['시공자·감리자와 준공 서류를 준비해 공식 서식 "준공인가신청서"를 낸다.', '신청일을 날짜 칸에 넣어 회계감사 요청 기한을 확인한다.', '준공 전에 입주가 필요하면 "준공인가 전 사용허가신청서"를 낸다.', '입주 지정 기간과 잔금 납부 방법을 조합원에게 통지한다.'],
    s12a: ['측량업체에 대지확정측량을 맡긴다.', '분양받을 사람에게 관리처분계획에서 정한 내용을 통지한다.', '이전고시를 공보에 싣고 구청에 보고한 뒤 법무사를 통해 등기한다.', '이전고시일을 날짜 칸에 넣어 해산 총회 기한을 확인한다.'],
    s12b: ['조합원별 청산금 내역서를 만든다.', '총회에서 징수·지급 방법을 의결한다.', '내역서를 통지하고 납부·지급을 진행한다.'],

      '<xf numFmtId="14" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="10" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="3" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs></styleSheet>';
    return zip([
      { name: '[Content_Types].xml', text: X + '<Types xmlns="' + NS + 'package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>' },
      { name: '_rels/.rels', text: X + '<Relationships xmlns="' + NS + 'package/2006/relationships"><Relationship Id="rId1" Type="' + NS + 'officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>' },
      { name: 'xl/workbook.xml', text: X + '<workbook xmlns="' + NS + 'spreadsheetml/2006/main" xmlns:r="' + NS + 'officeDocument/2006/relationships"><sheets><sheet name="' + xmlEsc(sheet.title).slice(0, 31) + '" sheetId="1" r:id="rId1"/></sheets></workbook>' },
      { name: 'xl/_rels/workbook.xml.rels', text: X + '<Relationships xmlns="' + NS + 'package/2006/relationships"><Relationship Id="rId1" Type="' + NS + 'officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="' + NS + 'officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>' },
      { name: 'xl/styles.xml', text: styles },
      { name: 'xl/worksheets/sheet1.xml', text: ws }
    ]);
  }
  window.__xlsx = function (k, n) { return xlsx(SHEETS[k], n); };
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-sheet]');
    if (!t) return;
    var sh = SHEETS[t.dataset.sheet];
    saveFile(sh.title + (S.name ? ' ' + S.name.replace(/[\\/:*?"<>|]/g, ' ') : '') + '.xlsx', xlsx(sh), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  });

  // ---- 잠금 버전 만들기: 이 PC 프로그램에서만 보인다. 공유된 화면에는 비밀번호를 바꾸는 기능이 없다. ----
  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'lockForm') return;
    e.preventDefault();
    var a = document.getElementById('lockPw1'), b = document.getElementById('lockPw2'), out = document.getElementById('lockMsg');
    if (a.value.length < 8) { out.textContent = '비밀번호는 8자 이상으로 정해 주세요.'; return; }
    if (a.value !== b.value) { out.textContent = '두 칸의 비밀번호가 서로 다릅니다.'; return; }
    var salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    var plain = new TextEncoder().encode(JSON.stringify({ PHASES: PHASES, PLAYERS: PLAYERS, TERMS: TERMS, HOWTO: HOWTO, FORMMAP: FORMMAP, SHEETMAP: SHEETMAP, SHEETS: SHEETS }));
    out.textContent = '잠그는 중입니다…';
    keyFrom(a.value, salt, ITER).then(function (k) { return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, k, plain); }).then(function (ct) {
      var from = SRC.indexOf('/*CONTENT' + '-START*/'), to = SRC.indexOf('/*CONTENT' + '-END*/');
      var hd = document.querySelector('header').cloneNode(true);
      hd.querySelector('#msg').textContent = ''; hd.querySelector('#total').textContent = ''; hd.querySelector('#bar').removeAttribute('style');
      hd.querySelector('#proj').innerHTML = '';   // 내 사업장 이름이 잠금 파일에 들어가지 않게 한다
      var close = '<' + '/script>';
      var html = '<title>재건축 절차 체크리스트</title>\n<style>' + document.querySelector('style').textContent + '</style>\n' + hd.outerHTML +
        '\n<div class="wrap"><nav id="nav" aria-label="단계"></nav><main id="main"></main></div>\n<div id="print"></div>\n<script src="data.js">' + close +
        '\n<script>window.__LOCKED = ' + JSON.stringify({ v: 1, it: ITER, salt: b64(salt), iv: b64(iv), ct: b64(ct) }) + ';' + close +
        '\n<script>' + SRC.slice(0, from) + SRC.slice(to) + close + '\n';
      a.value = b.value = '';
      out.textContent = '잠금 파일을 만들었습니다. 저장 창에서 문서 > 도시정비법 찾기 > dosi-law 폴더에 저장해 주세요.';
      saveFile('rebuild-locked.html', html, 'text/html');
    }).catch(function () { out.textContent = '잠금 파일을 만들지 못했습니다. 다시 시도해 주세요.'; });
  });

  render();

  // 위쪽 "비밀번호 잠금 설정" 버튼: 설정 칸으로 바로 이동한다 (주소 끝에 #lock을 붙여 열어도 같다)
  function showLock() {
    S.phase = 0; save(); render();
    var box = document.querySelector('.lock');
    if (!box) return;
    box.scrollIntoView({ block: 'center' });
    document.getElementById('lockPw1').focus();
  }
  var btnLock = document.getElementById('btnLock');
  if (inViewer || window.__LOCKED) btnLock.hidden = true;
  else {
    btnLock.addEventListener('click', showLock);
    if (location.hash === '#lock') showLock();
  }
  }

  var ITER = 310000;
  function b64(buf) { var b = new Uint8Array(buf), s = ''; for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s); }
  function unb64(s) { var bin = atob(s), b = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i); return b; }
  function keyFrom(pw, salt, it) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (k) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: it, hash: 'SHA-256' }, k, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    });
  }
  function gate() {
    var L = window.__LOCKED, main = document.getElementById('main'), tools = document.querySelector('.tools');
    tools.hidden = true;
    if (!L || !window.crypto || !crypto.subtle) { main.textContent = '이 화면을 열 수 없습니다. 보낸 사람에게 문의해 주세요.'; return; }
    main.innerHTML = '<form class="step gate" id="gateForm"><h3>비밀번호를 입력하세요</h3><p class="who">이 체크리스트는 잠겨 있습니다. 보낸 사람에게 받은 비밀번호를 넣으면 열립니다.</p>' +
      '<label for="gatePw">비밀번호</label><input type="password" id="gatePw" autocomplete="off"><button class="btn pri" type="submit">열기</button><p class="who" id="gateMsg" role="status"></p></form>';
    document.getElementById('gateForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var out = document.getElementById('gateMsg');
      out.textContent = '확인하는 중입니다…';
      keyFrom(document.getElementById('gatePw').value, unb64(L.salt), L.it).then(function (k) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(L.iv) }, k, unb64(L.ct));
      }).then(function (buf) {
        var C = JSON.parse(new TextDecoder().decode(buf));
        PHASES = C.PHASES; PLAYERS = C.PLAYERS; TERMS = C.TERMS; HOWTO = C.HOWTO; FORMMAP = C.FORMMAP; SHEETMAP = C.SHEETMAP; SHEETS = C.SHEETS;
        tools.hidden = false;
        start();
      }, function () { out.textContent = '비밀번호가 맞지 않습니다.'; });
    });
  }
  if (PHASES) start(); else gate();
})();
</script>
</body>
