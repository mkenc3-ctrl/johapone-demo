<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>조합ONE — 조합 전용 공간</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B5563">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="조합ONE">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--ink:#1E2124;--ink2:#464C53;--muted:#5F6B75;--line:#D6DCE0;--line2:#E6EAED;--bd:#B1B8BE;--pri:#0B5563;--pri-d:#08434E;--pri-s:#E6F1F3;--bg2:#F4F6F8;--acc:#C2410C;--acc-d:#8A2E07;--acc-s:#FDEEE6;--ok:#1F7A4D;--ok-s:#E5F3EA;--no:#B42318;--no-s:#FDECEA;--cafe:#03A94D}
*{box-sizing:border-box}
body{margin:0;background:var(--bg2);color:var(--ink);font:16px/1.6 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;word-break:keep-all;font-variant-numeric:tabular-nums}
a{color:var(--pri)}button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);border:1px solid var(--bd);border-radius:6px;padding:0 12px;height:42px;background:#fff;min-width:0}
textarea{height:auto;padding:10px 12px;resize:vertical}
h1,h2,h3{letter-spacing:-.02em}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 16px;border-radius:6px;border:1px solid var(--bd);background:#fff;color:var(--ink);font-size:15px;font-weight:500;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--pri-s)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}.btn.pri:hover{background:var(--pri-d)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}.btn.acc:hover{background:var(--acc-d)}
.btn.sm{height:34px;padding:0 12px;font-size:14px}
.btn.lg{height:54px;padding:0 28px;font-size:17px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tag{display:inline-block;font-size:12px;font-weight:700;line-height:1.7;border-radius:4px;padding:0 7px;background:var(--pri-s);color:var(--pri);white-space:nowrap}
.tag.acc{background:var(--acc-s);color:var(--acc-d)}.tag.ok{background:var(--ok-s);color:var(--ok)}.tag.no{background:var(--no-s);color:var(--no)}.tag.gray{background:var(--line2);color:var(--ink2)}
/* 상단 */
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);height:64px;display:flex;align-items:center;gap:16px;padding:0 20px}
.logo{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink)}
.logo b{font-size:20px;line-height:1}.logo em{font-style:normal;color:var(--acc)}
.org{font-size:14px;color:var(--ink2);border-left:1px solid var(--line);padding-left:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.who{display:flex;align-items:center;gap:10px;font-size:14px}
.av{width:36px;height:36px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.av.gov{background:#3B4A8A}.av.admin{background:var(--acc)}
.who small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
/* 레이아웃 */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 64px)}
.side{background:#fff;border-right:1px solid var(--line);padding:16px 10px 40px;position:sticky;top:64px;height:calc(100vh - 64px);overflow-y:auto}
.side .g{font-size:12px;font-weight:700;color:var(--muted);padding:14px 10px 4px}
.side a{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:15px}
.side a:hover{background:var(--bg2)}
.side a.on{background:var(--pri-s);color:var(--pri);font-weight:700}
.side a .tag{margin-left:auto}
.side a{padding:11px 12px;font-size:16px}
.gtabs{display:flex;flex-wrap:wrap;gap:6px;margin:-6px 0 22px}
.gtabs a{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink2);text-decoration:none;font-size:15px;font-weight:500}
.gtabs a:hover{border-color:var(--pri);color:var(--pri)}
.gtabs a.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.main{padding:28px 32px 80px;min-width:0;max-width:1240px}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
.ph h1{margin:0;font-size:26px}
.ph p{margin:4px 0 0;color:var(--ink2);font-size:15px}
.ph-r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* 사용 가이드 */
.guide-btn{border-color:var(--pri);color:var(--pri);font-weight:700}
.gsteps{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.gsteps li{display:flex;gap:14px;align-items:flex-start;font-size:17px;line-height:1.6;background:var(--bg2);border-radius:10px;padding:14px 16px}
.gsteps .gi{font-size:26px;line-height:1.1;flex:none;width:34px;text-align:center}
.gtip{margin:14px 0 0;font-size:16px;background:var(--acc-s);color:var(--acc-d);border-radius:10px;padding:12px 14px;line-height:1.6}
.gcard h2{display:flex;align-items:center;justify-content:space-between;gap:8px}
/* 큰 글씨 모드 (조합원 기본): 어르신도 읽기 쉽게 */
body.big .main{zoom:1.14} /* 화면 안 모든 글씨·버튼을 같은 비율로 키움 (글씨 크기가 따로 지정된 곳까지) */
body.big #modal{zoom:1.08}
body.big .side a{font-size:18px;padding:13px 12px}
.law{font-size:13px;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px}
.card h2{margin:0 0 12px;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 a{font-size:13px;font-weight:400;color:var(--muted);text-decoration:none}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr))}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.kpi span{font-size:13px;color:var(--muted)}
.kpi b{display:block;font-size:28px;line-height:1.3;color:var(--pri)}
.kpi b small{font-size:15px;color:var(--ink2);font-weight:500;margin-left:2px}
.kpi.acc b{color:var(--acc)}
.bar{height:10px;background:var(--line2);border-radius:5px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--pri);border-radius:5px}
.bar.acc i{background:var(--acc)}
.bar .goal{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
/* 표 */
.tw{overflow-x:auto;border-top:2px solid var(--ink)}
table.t{width:100%;border-collapse:collapse;font-size:15px}
.t th{background:var(--bg2);font-weight:700;padding:11px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap;font-size:14px}
.t td{padding:11px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.t tr.click{cursor:pointer}.t tr.click:hover td{background:#F8FAFB}
.t .c{text-align:center}.t .r{text-align:right}
.t tr.notice td{background:#FFFBF5}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;gap:10px;align-items:baseline;padding:10px 2px;border-bottom:1px solid var(--line2);font-size:15px}
.list li:last-child{border-bottom:0}
.list .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list time,.list .m{font-size:13px;color:var(--muted);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{height:38px;padding:0 14px;border:0;border-right:1px solid var(--bd);background:#fff;font-size:14px;color:var(--ink2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--pri);color:#fff;font-weight:700}
.tabs{display:flex;gap:24px;border-bottom:2px solid var(--line);margin-bottom:20px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:10px 0;margin-bottom:-2px;border-bottom:3px solid transparent;font-size:16px;font-weight:700;color:var(--muted)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--pri)}
.tool{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tool .sp{min-width:8px}
.note{background:var(--pri-s);border-radius:8px;padding:12px 16px;font-size:14px;color:var(--pri-d)}
.note.acc{background:var(--acc-s);color:var(--acc-d)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.action{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:#fff;text-decoration:none;color:var(--ink)}
.action:hover{border-color:var(--pri)}
.action .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--acc-s);flex:none}
.action b{display:block}.action span{font-size:14px;color:var(--muted)}
.action .go{margin-left:auto;color:var(--pri);font-weight:700;font-size:14px;white-space:nowrap}
.dot{display:inline-block;width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);vertical-align:middle;background:#fff}
.dot.on{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 3px #fff}
button.dot{padding:0}
/* 폼 */
.f{display:flex;flex-direction:column;gap:14px}
.f label{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:500;color:var(--ink2)}
.f .row{display:flex;gap:12px;flex-wrap:wrap}.f .row>*{flex:1 1 180px}
/* 모달 */
dialog{border:0;border-radius:12px;padding:0;width:min(720px,calc(100% - 32px));max-height:calc(100vh - 48px);color:var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(30,33,36,.55)}
.mh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:1}
.mh h2{margin:0;font-size:20px}
.mh button{border:0;background:none;font-size:24px;line-height:1;color:var(--muted);padding:4px 8px}
.mb{padding:20px 24px 24px}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:0 24px 22px}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);opacity:0;transition:.2s;background:var(--ink);color:#fff;padding:12px 20px;border-radius:8px;font-size:15px;z-index:100;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* 로그인 */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:#EEF5F6 linear-gradient(rgba(11,85,99,.06) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,rgba(11,85,99,.06) 1px,transparent 1px) 0 0/32px 32px}
.lbox{width:min(920px,100%);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(270px,100%),1fr));gap:16px}
.lhead{grid-column:1/-1;text-align:center;margin-bottom:8px}
.lhead h1{margin:8px 0 4px;font-size:30px}
.lhead p{margin:0;color:var(--ink2)}
.lcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px;display:flex;flex-direction:column;gap:12px;border-top:5px solid var(--pri)}
.lcard.admin{border-top-color:var(--acc)}.lcard.gov{border-top-color:#3B4A8A}
.lcard h2{margin:0;font-size:20px}
.lcard p{margin:0;font-size:14px;color:var(--ink2);flex:1}
.lcard ul{margin:0;padding-left:18px;font-size:14px;color:var(--ink2)}
/* 홈 전체 메뉴 */
.mcard{margin-bottom:18px}
.mgrid{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr));gap:12px}
.mtile{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:38px 12px 20px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);text-decoration:none}
.mtile:hover{border-color:var(--pri);background:#F8FBFB}
.mtile .me{width:56px;height:56px;border-radius:50%;background:var(--pri-s);display:flex;align-items:center;justify-content:center;font-size:27px;flex:none}
.mtile.paid .me{background:var(--acc-s)}
.mtile .mt{display:flex;flex-direction:column;gap:4px}
.mtile b{font-size:17px}
.mtile small{font-size:14px;color:var(--muted);line-height:1.45}
.mtile .tag{position:absolute;top:8px;right:8px}
/* 처음 오신 분 · 회원가입 (큰 글씨) */
.lfirst{grid-column:1/-1;background:#fff;border:2px solid var(--pri);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px;max-width:560px;width:100%;justify-self:center}
.lfirst h2{margin:0;font-size:26px;text-align:center}
.lfirst > p{margin:0 0 4px;font-size:17px;color:var(--ink2);text-align:center}
.btn.big{height:60px;font-size:19px;border-radius:10px;width:100%}
.ldemo{grid-column:1/-1;text-align:center;margin:10px 0 0;font-size:15px;color:var(--ink2)}
.su{display:flex;flex-direction:column;gap:14px}
.su label{display:flex;flex-direction:column;gap:6px;font-size:17px;font-weight:700;color:var(--ink)}
.su input,.su select{height:56px;font-size:18px;padding:0 14px;border-radius:9px}
.su .hint{font-size:15px;font-weight:400;color:var(--muted)}
.su-prog{display:flex;gap:6px;margin-bottom:6px}
.su-prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.su-prog i.on{background:var(--pri)}
.su-q{font-size:21px;font-weight:700;margin:0}
.su-roles{display:grid;gap:10px}
.su-roles label{flex-direction:row;align-items:center;gap:14px;border:2px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;font-size:18px}
.su-roles label:has(input:checked){border-color:var(--pri);background:var(--pri-s)}
.su-roles input{width:24px;height:24px;flex:none}
.su-roles small{display:block;font-size:15px;font-weight:400;color:var(--muted)}
.su-roles .e{font-size:30px}
.su-nav{display:flex;gap:10px;margin-top:6px}
.su-nav .btn{flex:1;height:58px;font-size:18px}
.su-rule{font-size:15.5px;font-weight:400;margin:0;color:var(--muted)}
.su-rule.ok{color:var(--ok);font-weight:700}
.su-steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.su-steps li{display:flex;gap:12px;align-items:flex-start;font-size:18px;line-height:1.55;background:var(--bg2);border-radius:10px;padding:14px}
.su-steps b.n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:16px}
/* 카페 */
.cafe-cover{min-height:150px;display:flex;align-items:flex-end;border-radius:10px 10px 0 0;background:linear-gradient(120deg,#0B5563 0%,#1B7F8F 55%,#F2B84B 140%);position:relative;overflow:hidden}
.cafe-cover::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 40px,transparent 40px 80px)}
.cafe-cover h2{position:relative;padding:24px 24px 18px;margin:0;line-height:1.35;color:#fff;font-size:26px;z-index:1}
.cafe-cover small{display:block;font-size:14px;font-weight:400;opacity:.85}
.cafe{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;margin-top:20px}
.cafe-l{display:flex;flex-direction:column;gap:12px;min-width:0}
.cbox{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;font-size:14px}
.cbox dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.cbox dt{color:var(--muted)}.cbox dd{margin:0;text-align:right;font-weight:500}
.cmenu a{display:flex;justify-content:space-between;padding:7px 8px;border-radius:4px;text-decoration:none;color:var(--ink);font-size:14px}
.cmenu a.on{color:var(--cafe);font-weight:700;background:#EFFAF3}
.cmenu a span{color:var(--muted);font-size:12px}
.cwrite{height:48px;background:var(--cafe);color:#fff;border:0;border-radius:6px;font-weight:700;font-size:16px}
.cwrite:disabled{background:#B9C2C8}
.cmt{border-top:1px solid var(--line2);padding:12px 0;font-size:15px}
.cmt b{font-size:14px}.cmt time{font-size:12px;color:var(--muted);margin-left:6px}
.cnt{color:var(--acc);font-weight:700;font-size:13px}
.lv{font-size:11px;color:var(--cafe);border:1px solid var(--cafe);border-radius:3px;padding:0 4px;margin-left:4px;vertical-align:1px}
/* 단계 */
.steps{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap}
.steps span{flex:1 1 100px;text-align:center;font-size:13px;padding:8px 4px;border-radius:6px;background:var(--line2);color:var(--muted);font-weight:500}
.steps span.on{background:var(--pri);color:#fff;font-weight:700}
.steps span.done{background:var(--pri-s);color:var(--pri)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice button{height:120px;border:2px solid var(--line);border-radius:10px;background:#fff;font-size:22px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.choice button small{font-size:13px;font-weight:400;color:var(--muted)}
.choice button.on.y{border-color:var(--ok);background:var(--ok-s);color:var(--ok)}
.choice button.on.n{border-color:var(--no);background:var(--no-s);color:var(--no)}
.sig{width:100%;height:180px;border:2px dashed var(--bd);border-radius:8px;background:#fff;touch-action:none;cursor:crosshair}
.doc{border:1px solid var(--line);border-radius:8px;padding:20px;background:#FCFCFD;font-size:15px;max-height:340px;overflow:auto}
.doc h3{text-align:center;margin:0 0 12px;font-size:20px}
.doc table{width:100%;border-collapse:collapse;margin:10px 0}
.doc td,.doc th{border:1px solid var(--bd);padding:7px 10px;font-size:14px;text-align:left}
.doc th{background:var(--bg2);width:34%}
.voter{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.voter button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:20px;display:flex;align-items:center;gap:14px;text-align:left}
.voter button:hover{border-color:var(--pri)}
.voter button[disabled]{opacity:.55;cursor:default}
.agenda{border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:12px;background:#fff}
.agenda h3{margin:0 0 4px;font-size:17px}
.agenda p{margin:0 0 12px;font-size:14px;color:var(--muted)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts button{flex:1 1 110px;height:48px;border:2px solid var(--line);border-radius:8px;background:#fff;font-weight:700}
.opts button.on{border-color:var(--pri);background:var(--pri-s);color:var(--pri)}
/* 총회 */
.room{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px}
.stage{background:#111417;border-radius:12px;aspect-ratio:16/9;position:relative;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:32px}
.stage .live{position:absolute;top:16px;left:16px;background:#E5322D;font-weight:700;font-size:13px;padding:3px 10px;border-radius:4px;display:flex;gap:6px;align-items:center}
.stage .live i{width:8px;height:8px;border-radius:50%;background:#fff;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
.stage .tm{position:absolute;top:16px;right:16px;font-size:14px;opacity:.8}

    var p = { id: id, cat: f.cat.value, title: f.title.value, body: f.body.value, file: att ? att.name : '', w: w, at: draft ? '' : today(), state: draft ? 'draft' : 'pub', push: f.push.checked, views: 0, reads: [] };
    if (att && !att.local) p.att = att;
    S.posts.push(p);
    if (!draft && f.push.checked) S.sms.unshift({ at: now(), target: '전체 조합원', ch: '알림톡', msg: '[' + UNION + '] 정보공개: ' + f.title.value, n: roster().length });
    save(); closeModal(); render();
    toast(draft ? '공개 대기로 저장했습니다. 공개 기한: ' + dF(discDue(p)) : '공개했습니다.' + (f.push.checked ? ' 조합원 ' + roster().length + '명에게 알림톡을 보냈습니다.' : '') + (discStatus(p)[0] === 'no' ? ' (15일 기한을 넘긴 공개입니다)' : ''));
  },
  cafe: function (f) {
    uploadField(f, 'cafe').then(function (att) {
      var id = Math.max.apply(null, S.cafe.map(function (c) { return c.id; }).concat(0)) + 1, c = { id: id, board: f.board.value, notice: f.board.value === '공지사항', title: f.title.value, body: f.body.value, author: U().name, aid: ME, at: today(), views: 0, likes: 0, comments: [] };
      if (att && !att.local) c.att = att;
      S.cafe.push(c); save(); location.hash = '#cafe/post/' + id; toast('글이 등록되었습니다.');
    }).catch(function (e) { toast('첨부 실패: ' + e.message); });
  },
  comment: function (f) { var c = S.cafe.filter(function (x) { return x.id === +f.dataset.id; })[0]; c.comments.push({ author: U().name, body: f.b.value, at: now() }); save(); render(); },
  chat: function (f) { S.asm.chat.push({ n: U().name, m: f.m.value }); save(); render(); },
  sms: function (f) { var n = { '전체 조합원': roster().length, '동의서 미제출자': consentStats().none, '서면결의서 미제출자': roster().filter(function (x) { return !x.written; }).length, '대의원': 4 }[f.t.value]; S.sms.unshift({ at: now(), target: f.t.value, ch: f.c.value, msg: f.m.value, n: n }); save(); render(); toast(f.t.value + ' ' + n + '명에게 ' + f.c.value + '을 보냈습니다 (시안). 예상 비용 ' + won(n * (f.c.value === '알림톡' ? 15 : 50)) + '원'); },
  ev: function (f) { S.events.push({ d: f.d.value, t: f.t.value, k: f.k.value }); S.events.sort(function (a, b) { return a.d < b.d ? -1 : 1; }); save(); closeModal(); render(); },
  off: function (f) {
    var o = offc(), id = f.dataset.id, v = { id: id || 'f' + Date.now(), name: f.n.value.trim(), title: f.ti.value, at: f.at.value.replace(/-/g, '.'), ext: +f.ex.value || 0, uid: f.u.value };
    if (id) o.list = o.list.map(function (x) { return x.id === id ? v : x; }); else o.list.push(v);
    S.offc = o; log((id ? '임원 정보 수정: ' : '임원 등록: ') + v.name + ' ' + v.title); save(); closeModal(); render(); toast('저장했습니다. 이수 기한 ' + dF(offDue(v)));
  },
  chg: function (f) {
    var x = roster().filter(function (r) { return r.no === +f.dataset.no; })[0], c = chgOf(f); if (!x) return;
    if (!c.to) return toast('새 소유자 성명을 입력하세요.');
    c.from = x.name; c.fromShare = x.share; c.by = U().name; c.rec = now();
    (x.hist = x.hist || []).push(c);
    x.name = c.to; x.share = c.share || x.share; x.phone = c.phone; x.rrn = ''; x.addr = ''; x.idcard = false; x.written = false; // 이전 소유자 개인정보는 남기지 않음 (이력에는 성명만)
    var bad = chgCheck(c).some(function (k) { return k[0] === 'no'; });
    if (bad) x.cashOut = true; else delete x.cashOut;
    if (!IMPORTED) save(); log('조합명부 변동: 연번 ' + x.no + ' ' + c.from + ' → ' + c.to, c.why); closeModal(); render();
    toast(bad ? '저장했습니다. 조합원 자격 취득 불가 대상으로 표시했습니다 (법 제39조 제2항).' : '변동을 저장했습니다.');
  },
  bid: function (f) {
    var b = { id: Date.now(), title: f.t.value, kind: f.k.value, est: +f.e.value || 0, type: f.ty.value, fails: +f.fa.value || 0, brief: +f.br.value || 0, ep: f.ep.checked, auth: f.au.checked, at: today(), due: f.d.value.replace(/-/g, '.'), st: '진행' };
    if (b.due < b.at) return toast('마감일이 공고일보다 빠릅니다.');
    S.bids.unshift(b); log('입찰공고 등록: ' + b.title); save(); closeModal(); render();
    var l = bidLevel(b); toast(l === 'no' ? '등록했습니다. 법정 요건 보완이 필요합니다 — 공고를 눌러 확인하세요.' : l === 'acc' ? '등록했습니다. 확인이 필요한 항목이 있습니다.' : '등록했습니다. 법정 요건에 적합합니다.');
  },
  q: function (f) { S.qna.unshift({ id: Date.now(), uid: ME, name: U().name, title: f.t.value, body: f.b.value, at: today(), answer: '' }); save(); closeModal(); render(); toast('문의가 등록되었습니다.'); },
  ans: function (f) { var q = S.qna.filter(function (x) { return x.id === +f.dataset.id; })[0]; q.answer = f.a.value; save(); render(); }
};
document.addEventListener('submit', function (e) { var f = e.target, k = f.dataset.form; if (!k || !FORMS[k]) return; e.preventDefault(); FORMS[k](f); });
document.addEventListener('input', function (e) {
  // 총회 설정 편집: 다시 그리지 않고 편집본(MD)과 소집통지 미리보기만 갱신
  if (e.target.dataset && e.target.dataset.md && MD && e.target.dataset.md !== 'kind') {
    var k = e.target.dataset.md, i = e.target.dataset.i, v = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
    if (k === 'k' || k === 'mt' || k === 'inc') { if (i == null) MD[k] = v; else MD.agendas[+i][k] = v; render(); return; } // 요건 안내가 바뀌므로 다시 그림
    if (i == null) MD[k] = v;
    else if (k === 'o') MD.agendas[+i].o = v.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    else MD.agendas[+i][k] = v;
    var nEl = $('#mdNotice'); if (nEl) nEl.textContent = meetNotice(MD);
    return;
  }
  if (e.target.dataset && e.target.dataset.pw != null) { suRules(e.target.form); return; }
  if (e.target.id === 'rq') { rq = e.target.value; var p = e.target.selectionStart; render(); var n = $('#rq'); n.focus(); n.setSelectionRange(p, p); }
  if (e.target.closest && e.target.closest('#calcF')) calcRun();
  if (e.target.dataset.sc) { SC[+e.target.dataset.sc][+e.target.dataset.k] = +e.target.value || 0; var y = window.scrollY; render(); window.scrollTo(0, y); var d = document.querySelector('details'); if (d) d.open = true; }
});
document.addEventListener('change', function (e) {
  if (e.target.form && e.target.form.dataset.form === 'chg') { var b = $('#chgChk'); if (b) b.innerHTML = chgList(chgOf(e.target.form)); return; } // 변동 등록: 법정 점검 미리보기
  if (e.target.dataset && e.target.dataset.md === 'kind' && MD) { var a = MD.agendas[+e.target.dataset.i]; a.o = e.target.value === 'yn' ? OPT_PRESET.yn.slice() : ['A업체', 'B업체']; render(); return; }
  if (e.target.id === 'rfilter') { rfilter = e.target.value; render(); }
  // 성원 집계 입력 (현장·대리인 출석, 현장 표결)
  if (e.target.dataset.q) { S.vote[e.target.dataset.q] = Math.max(0, +e.target.value || 0); save(); render(); return; }
  if (e.target.dataset.lv) {
    var ij = e.target.dataset.lv.split(','), L = S.vote.live = S.vote.live || agendas().map(function (a) { return a.o.map(function () { return 0; }); });
    (L[+ij[0]] = L[+ij[0]] || [])[+ij[1]] = Math.max(0, +e.target.value || 0); save(); var y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  if (e.target.dataset.link) { // 실제 조합원 ↔ 명부 연결 변경
    var uid = e.target.dataset.link, v = e.target.value;
    SYNC.linkMember(uid, v).then(function (r) { if (r.error) toast('연결 실패: ' + r.error.message); else { (MEMBERS || []).forEach(function (m) { if (m.user_id === uid) m.member_no = v || null; }); toast(v ? '명부와 연결했습니다.' : '연결을 해제했습니다.'); } });
  }
  if (e.target.id === 'xfile' && e.target.files[0]) parseFile(e.target.files[0]);
  if (e.target.dataset.map) { imp.map[e.target.dataset.map] = +e.target.value; render(); }
});
document.addEventListener('dragover', function (e) { var d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', function (e) { var d = e.target.closest && e.target.closest('#drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', function (e) { var d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.remove('over'); if (e.dataTransfer.files[0]) parseFile(e.dataTransfer.files[0]); } });
window.addEventListener('hashchange', function () { closeModal(); render(); window.scrollTo(0, 0); });
render();
