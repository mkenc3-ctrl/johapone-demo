상옵션 신청」에서 원하는 품목에 체크하면 합계 금액이 바로 나옵니다."],["","<b>「신청하기」</b>를 누르면 끝입니다. 마감일 전까지는 고칠 수 있습니다."],["","입주 사전점검 날 「입주 사전점검」에서 품목이 들어왔는지 표시합니다."]],tip:"대금은 이 화면에서 내지 않습니다. 시공사 옵션 계약 안내를 따르세요."},admin:{t:"유·무상 옵션 관리",s:[["","「품목·기간 관리」에서 무상 품목·유상옵션 품목과 가격, 신청 기간을 등록합니다."],["","「신청 현황」에서 품목별·세대별 신청을 보고 엑셀로 내려받아 시공사에 전달합니다."],["","「약속 대조표」에서 입찰 제안서·공사계약서·실제 시공을 비교해 일치·변경·누락을 표시합니다."],["","입주 때 「사전점검 결과」에서 문제 있는 품목을 모아 봅니다."]]},gov:{t:"유·무상 옵션 열람",s:[["","무상 품목 약속 대조표와 품목별 신청 집계를 열람합니다."],["","조합원별 신청 내용은 보이지 않습니다."]]}},home:{member:{t:"홈 화면",s:[["👀","처음 화면에 지금 해야 할 일이 큰 카드로 나옵니다."],["📋","「전체 메뉴」에 모든 카테고리가 카드로 나옵니다. 카드를 누르면 그 화면으로 갑니다."],["👆","아래 할 일 카드의 「투표하기」「제출하기」를 누르면 바로 처리할 수 있습니다."]],tip:"할 일이 없으면 카드가 사라집니다."},admin:{t:"대시보드",s:[["📊","조합원 수, 동의율, 투표 참여, 미제출 인원을 한눈에 봅니다."],["✅","「처리할 일」에 답변 대기 문의, 공개 기한, 교육 기한이 모입니다."],["👆","항목을 누르면 해당 화면으로 바로 이동합니다."]]},gov:{t:"관할 조합 현황",s:[["🏛️","관할 조합 목록과 조합원 수, 동의율이 나옵니다."],["🚩","공개 지연·교육 미이수·입찰 보완 칸에 숫자가 있으면 점검이 필요한 조합입니다."],["📂","「열람」을 누르면 그 조합의 자료를 볼 수 있습니다 (수정은 불가)."]]}},vote:{member:{t:"전자투표 하는 법",s:[["1️⃣","「투표할 조합원 선택」에서 <b>본인 이름</b>을 누릅니다."],["2️⃣","서면결의서 표에서 안건마다 <b>찬성 · 반대</b> 칸을 누르면 <b>●</b>로 표시됩니다."],["3️⃣","모든 안건에 표시한 뒤 맨 아래 <b>「서면결의서 제출」</b>을 누르면 끝입니다."]],tip:"투표 결과는 총회에서 개표하기 전까지 누구도 볼 수 없습니다. 휴대폰이 어려우시면 종이 서면결의서로도 참여할 수 있습니다."},admin:{t:"전자투표 관리",s:[["👥","진행 중에는 참여 인원만 보이고 찬반 집계는 숨겨집니다 (법정 요건)."],["🧮","「성원·의결 점검」에 현장·대리인 출석 수를 입력하면 성원 여부가 계산됩니다."],["🗳️","총회에서 「투표 마감·개표」를 누르면 안건별 결과와 가결 여부가 나옵니다."],["📝","「의사록 초안 만들기」로 결과를 채운 의사록을 만들어 인쇄하거나 공개 대기로 저장합니다."]]},gov:{t:"총회·의결 결과",s:[["📅","관할 조합별 총회 일정과 전자투표 참여 인원을 봅니다."],["🔒","개표 전에는 찬반 집계가 보이지 않습니다."],["📋","개표 후에는 안건별 결과가 표로 나옵니다."]]}},gvote:"vote",assembly:{all:{t:"온라인총회 참석하는 법",s:[["📅","총회 날 정해진 시간에 이 화면을 엽니다."],["🚪","<b>「입장하기」</b>를 누르고 본인확인을 합니다."],["📺","화면에서 진행 상황을 보고, 아래 채팅으로 의견을 남깁니다. 말하고 싶으면 「발언 신청」."],["👋","끝나면 「퇴장」을 누릅니다."]],tip:"온라인으로 참석해도 직접 출석으로 인정됩니다."}},consent:{member:{t:"동의서 제출하는 법",s:[["📄","동의서 내용을 천천히 읽습니다."],["👆","<b>찬성</b> 또는 <b>반대</b>를 누릅니다."],["✍️","네모 칸에 손가락으로 서명합니다."],["✅","<b>「서명하고 제출」</b>을 누르면 끝입니다."]],tip:"제출한 뒤에도 정해진 기간 안에는 철회할 수 있습니다. 화면에 철회 가능 여부가 나옵니다."},gov:{t:"동의 현황 열람",s:[["📈","조합의 동의서 제출 현황과 법정 요건 대비 동의율을 봅니다."],["🔒","열람만 가능하며 수정할 수 없습니다."]]},admin:{t:"전자동의서 관리",s:[["⚙️","동의 종류(추진위 구성·조합설립)와 검인 번호를 먼저 설정합니다."],["📈","사업 유형에 맞는 법정 요건 대비 동의율이 실시간으로 나옵니다."],["↩️","철회서를 받으면 「철회 접수」를 누릅니다."]]}},disclosure:{member:{t:"정보공개 보는 법",s:[["📂","조합이 올린 공지·계약서·회의록 목록이 나옵니다."],["👆","제목을 누르면 내용과 첨부파일이 열립니다."],["✅","다 읽으셨으면 「확인했습니다」를 누릅니다."]]},admin:{t:"정보공개 등록",s:[["➕","「+ 자료 등록」을 누르고 분류·제목·내용을 씁니다."],["📎","PDF나 사진을 첨부할 수 있습니다 (5MB 이하)."],["⏰","작성일부터 15일 안에 공개해야 합니다. 기한은 자동으로 계산됩니다."]]},gov:{t:"정보공개 열람",s:[["📂","조합이 공개한 자료를 열람합니다."],["👆","제목을 누르면 내용과 첨부파일을 볼 수 있습니다."]]}},gdisc:{gov:{t:"정보공개 점검",s:[["⏰","관할 조합 자료의 15일 공개 기한을 자동 계산합니다."],["💰","아래 「법정 공개 항목 이행」에서 조합별 월별 자금 공개·분기 통지·결산 공개를 봅니다."],["🚩","기한 초과 자료가 맨 위에 나옵니다."],["↻","「새로고침」으로 최신 내용을 불러옵니다."]]}},gedu:{gov:{t:"임원 교육 점검",s:[["👥","관할 조합 임원별 교육 이수 시간과 기한이 나옵니다."],["🚩","기한 초과·임박 임원이 위에 정리됩니다."]]}},acct:{member:{t:"회계 공개 보는 법",s:[["💰","조합 통장에 들어온 돈과 나간 돈을 달마다 보여 줍니다."],["👆","달을 누르면 그달의 입금·출금 내역이 하나하나 나옵니다."],["📊","아래에서 올해 예산을 얼마나 썼는지 볼 수 있습니다."]],tip:"궁금한 내역은 「조합원 카페 → 사무국에 묻기」로 물어보세요."},admin:{t:"회계 입력·공개",s:[["➕","「+ 입출금 등록」으로 날짜·항목·금액·증빙을 넣습니다."],["🔒","달이 끝나면 「마감·공개」를 누릅니다. 조합원에게 보이고 정보공개 글도 자동으로 올라갑니다."],["⏰","공개 기한은 다음 달 15일입니다 (법 제124조)."],["📑","연말에는 「결산보고서 만들기」로 결산표를 만듭니다."]]},gov:{t:"회계 공개 점검",s:[["💰","조합의 월별 입금·출금 내역과 공개 여부를 봅니다."],["🚩","공개 기한을 넘긴 달은 붉게 표시됩니다."]]}},cdash:{admin:{t:"한눈 현황판",s:[["📊","숫자를 누르면 해당 화면으로 갑니다."],["⏰","법정 기한은 도시정비법 조문 기준으로 자동 계산합니다. 정관이 더 짧으면 정관을 따르세요."],["🔔","「기한 알림 켜기」를 누르면 이 기기에 하루 한 번 알려 드립니다."]]}},chief:{admin:{t:"조합장 안내",s:[["🧭","조합장이 이 프로그램으로 하는 일과 메뉴를 한눈에 봅니다."],["⚠️","「꼭 지킬 것」은 법 위반이 생기기 쉬운 일입니다. 조항은 법령 메뉴에서 원문을 확인하세요."],["🖨️","「인쇄」로 조합장께 드릴 안내문을 뽑습니다."]],tip:"참고용 안내입니다. 조합 정관과 법률 자문을 함께 확인하세요."}},meetqa:{admin:{t:"총회 예상 질문",s:[["🎯","「이번 총회 맞춤」은 설정한 안건에 맞는 질문만 골라 줍니다."],["✏️","답변 초안을 우리 조합 사정에 맞게 고치고, ○ 표시는 실제 숫자로 채웁니다."],["🖨️","「리허설용 인쇄」로 질문 카드를 뽑아 총회 전에 연습합니다."]]}},mtg:{admin:{t:"회의록",s:[["📝","「+ 회의록 쓰기」에서 종류를 고르면 차수·재적·출석자가 지난 회의 기준으로 채워집니다."],["✅","확인이 끝나면 「확정」. 확정한 회의록은 고칠 수 없습니다."],["🖨️","「인쇄」해서 서명받고, 서명본을 스캔해 「서명본 올리기」를 누르면 문서보관함에 들어갑니다."],["📢","문서보관함에서 「정보공개로 올리기」. 회의 후 15일 안에 공개해야 합니다."]]}},dreg:{admin:{t:"문서 대장",s:[["📥","구청·업체에서 받은 공문은 「+ 받은 문서 접수」로 등록합니다. 접수번호가 자동으로 붙습니다."],["↩️","받은 문서를 열어 「회신 공문 기안」을 누르면 전자결재로 바로 이어집니다."],["📤","결재가 끝난 공문은 「보낸 공문」에 올라옵니다. 실제로 보낸 뒤 「발송 처리」를 눌러 날짜·방법을 남기세요."]]}},appr:{admin:{t:"전자결재",s:[["✏️","「+ 기안하기」에서 종류·제목·내용·금액을 쓰고 검토자·결재자를 고릅니다."],["✅","차례가 된 사람이 「승인」 또는 「반려」를 누릅니다. 다른 사람이 대신 승인하면 「대결」로 남습니다."],["💰","끝난 지출결의는 「회계 장부에 넣기」로 회계 공개에 바로 들어갑니다."],["🖨️","「인쇄」로 결재란이 있는 문서를 뽑을 수 있습니다."]],tip:"결재 문서는 지울 수 없고 회수·반려 기록이 남습니다 (법 제125조 보관)."}},staff:{admin:{t:"임직원·급여",s:[["👥","임직원을 등록합니다. 주민등록번호·계좌번호는 넣지 않습니다."],["📄","「○월 급여대장 만들기」를 누르면 상근 임직원 급여가 채워지고 4대 보험이 자동 계산됩니다."],["🔒","소득세를 넣고 「확정」하면 「회계 장부에 넣기」로 인건비가 들어갑니다."],["🖨️","급여대장과 개인 명세서를 인쇄할 수 있습니다."]],tip:"4대 보험 요율은 해마다 바뀝니다. 급여대장 위에서 고칠 수 있습니다."}},calendar:{all:{t:"조합 일정 보는 법",s:[["📅","달력에 총회·투표 마감·교육 일정이 표시됩니다."],["🔔","「휴대폰 달력에 넣기」로 넣어 두면 휴대폰이 미리 알려 줍니다."]]}},bids:{member:{t:"입찰공고 보는 법",s:[["📋","조합이 업체를 뽑는 입찰 목록입니다."],["👆","공고를 누르면 자세한 내용이 나옵니다."]]},admin:{t:"입찰공고 등록",s:[["➕","「+ 입찰공고 등록」에서 분류·추정가격·계약 방식을 입력합니다."],["🔎","법정 요건(계약 방식·금액 한도·전자조달)이 자동 점검됩니다."],["🏁","공고를 눌러 「유찰 처리」나 「낙찰·마감」을 합니다."]]},gov:{t:"입찰공고 점검",s:[["🔎","관할 조합 입찰이 법정 요건에 맞는지 자동 점검한 결과입니다."],["🚩","「보완 필요」가 맨 위에 나옵니다."]]}},me:{member:{t:"내 정보 보는 법",s:[["👤","내 조합원 정보(이름·소재지·지분·연락처)를 봅니다."],["📋","동의서·신분증·서면결의서·전자투표 제출 현황을 확인합니다."],["🧮","「분담금 계산」 탭에서 예상 분담금을 계산해 봅니다."]],tip:"정보가 바뀌었으면 조합 사무국에 연락하세요."}},calc:{member:{t:"분담금 계산",s:[["✏️","내 집 감정평가액을 만원 단위로 넣습니다 (32000 → 3억 2,000만 원)."],["🏠","받을 새 집 크기를 누르면 분양가가 채워집니다. 조합이 알려 준 금액으로 바꿔 넣으세요."],["🧮","분담금 또는 환급금이 바로 나오고, 비례율이 바뀔 때와 내는 시기도 함께 보입니다."],["📊","맨 아래 「사업비로 비례율 계산하기」를 열면 공사비가 오를 때 내 분담금이 얼마나 느는지 볼 수 있습니다."]],tip:"참고용 계산입니다. 정확한 금액은 관리처분계획에서 정해집니다."}},cafe:{all:{t:"조합원 카페 쓰는 법",s:[["📋","게시판을 골라 글 목록을 봅니다."],["👆","글 제목을 누르면 내용과 댓글이 나옵니다."],["✏️","글쓰기 허가를 받은 조합원은 「카페 글쓰기」로 글과 사진을 올릴 수 있습니다."]],tip:"글쓰기 권한이 없으면 「글쓰기 권한 신청」을 누르세요."}},qna:{member:{t:"사무국에 문의하기",s:[["➕","「+ 문의하기」를 누릅니다."],["✏️","제목과 궁금한 내용을 쓰고 보냅니다."],["💬","사무국 답변이 오면 같은 화면에 표시됩니다."]],tip:"전화나 방문 없이 기록이 남습니다."},admin:{t:"문의 답변",s:[["📥","조합원 문의가 올라옵니다."],["💬","답변을 입력하고 「답변 등록」을 누릅니다."]]}},edu:{all:{t:"조합임원교육 듣는 법",s:[["📚","강의 카드에서 「수강하기」를 누릅니다."],["📖","내용을 읽고 「학습 완료」를 누르면 기록이 남습니다."],["📊","맨 위 막대에서 12시간 중 이수한 시간을 확인합니다."]],tip:"조합임원은 선임일부터 6개월 이내 12시간 이상 이수해야 합니다 (시행령 제90조)."}},pro:{all:{t:"협력업체 연결",s:[["📌","맨 위에 지금 사업 단계에 필요한 분야가 나옵니다."],["🔎","분야를 고르거나 업무 이름으로 검색합니다."],["📋","「자세히」에서 확인할 자격을 보고, 「상담 요청」을 누르면 연락이 갑니다."],["⚖️","분야를 고르면 여러 곳에 한 번에 견적을 받아 비교할 수 있습니다."]]}},law:{all:{t:"법령·판례 검색",s:[["🔍","검색창에 궁금한 말(예: 동의서, 총회)을 씁니다."],["📖","관련 조문과 판례가 나옵니다."]]}},check:{all:{t:"조합운영과정 체크리스트",s:[["🪜","사업 단계별로 해야 할 일이 순서대로 나옵니다."],["☑️","끝난 일은 체크하고, 단계마다 필요한 서식은 「PDF 보기」로 바로 엽니다."]]}},roster:{gov:{t:"조합자료 열람",s:[["📋","조합원 명부와 서류 제출 현황을 봅니다."],["🔒","연락처는 가려서 보이며, 열람만 가능합니다. 주민등록번호는 받지 않고 생년월일만 둡니다."]]},admin:{t:"조합자료 관리·작성",s:[["📋","조합원 목록과 동의서·신분증·서면결의서 제출 여부를 봅니다."],["🔘","동그라미를 눌러 제출 여부를 바꿉니다."],["🔁","소유자가 바뀌면 이름 옆 「변동」을 눌러 등록합니다."],["📥","엑셀 명부는 「엑셀 가져오기」 탭에서 불러옵니다."]],tip:"주민번호는 가려서 보입니다. 원본을 볼 때는 사유가 기록됩니다."}},written:{admin:{t:"서면결의서·위임장 접수",s:[["📥","서류를 받으면 조합원 옆 「접수」를 누릅니다. 연번이 자동으로 매겨집니다."],["🪪","본인 확인을 체크하고, 위임장이면 대리인 성명과 구분을 넣습니다."],["🧮","위임장 수는 성원·의결 점검의 대리인 출석에 자동 반영됩니다."]]}},meetset:{admin:{t:"총회 설정·소집통지",s:[["📅","총회 일시·장소·전자의결 기간을 입력합니다."],["📝","안건과 안건 종류를 정합니다. 필요한 출석 인원이 자동 안내됩니다."],["💾","「저장」 후 「전체 조합원에게 알림톡 발송」으로 소집통지를 보냅니다."]]}},notify:{admin:{t:"알림톡 발송",s:[["👥","받을 대상과 채널을 고릅니다."],["✏️","내용을 쓰고 「발송하기」를 누릅니다."],["🧾","발송 이력이 자동으로 남습니다."]]}},forms:{all:{t:"서식함",s:[["🔍","서식 이름으로 검색합니다."],["📄","공식 서식은 「PDF 보기」로 바로 열립니다. 한글(HWP)은 PC에서 받으세요."],["📥","엑셀 양식은 「엑셀 받기」를 누르면 휴대폰에서는 공유 창이 뜹니다."]]}},bylaws:{admin:{t:"정관 개정",s:[["📜","전자의결·온라인총회 도입을 위한 신·구 조문 대비표가 준비되어 있습니다."],["🖨️","안건 다만 법이 정한 직접 출석(현장·대리인·온라인 참석) 비율을 따로 채워야 합니다. 오늘 직접 출석 ○명, 서면결의 ○명으로 성원이 충족되었습니다.","법 제45조, 제44조의2","성원 집계표 (현장·대리인·온라인·서면 구분)"],["p2","proc","소집 통지를 늦게 받았습니다. 이 총회가 유효한가요?","소집 통지는 법과 정관에 정한 기한까지 회의 목적·안건·일시·장소와 서면 의결 방법을 정해 보냈습니다. 발송일과 방법 기록을 보관하고 있습니다.","법 제44조, 정관","소집통지 발송 대장"],["p3","proc","서면결의서를 냈는데 오늘 직접 투표하고 싶습니다.","정관과 총회 운영 규정에 따라 서면결의를 철회하고 현장에서 의결권을 행사하실 수 있는지 안내드립니다. 철회를 확인한 뒤 중복 집계되지 않게 처리합니다.","정관·총회 운영 규정","서면결의 철회서 양식"],["p4","proc","전자투표는 믿을 수 있나요? 다른 사람이 대신 누른 것 아닌가요?","전자투표는 본인확인을 거쳐야 할 수 있고, 접속·투표 기록이 보관됩니다. 서면·전자·현장에서 중복으로 행사하면 한 번만 인정합니다.","법 제45조, 제44조의2","본인확인·접속 기록 요약"],["p5","proc","대리인으로 출석하려면 무엇이 필요한가요?","법과 정관이 정한 사람만 위임장과 신분증을 갖추어 대리할 수 있습니다. 접수처에서 확인 후 대리인 출석으로 기록합니다.","법 제45조, 정관","위임장 양식·대리인 접수 대장"],["a1","acct","운영비가 왜 이렇게 많이 들었나요?","항목별 집행 내역은 회계 공개 메뉴와 결산서에 있습니다. 예산보다 늘어난 항목은 ○○ 때문이며, ○○ 의결을 거쳤습니다.","법 제124조","예산 대비 집행표"],["a2","acct","회계감사는 받았나요?","법이 정한 시기에 외부 회계감사를 받았고, 감사보고서는 정보공개에 올려 두었습니다.","법 제112조","감사보고서"],["a3","acct","조합장·임원 보수는 얼마이고 누가 정했나요?","상근 임원 보수는 총회(또는 정관이 정한 기관)에서 승인한 예산 범위에서 지급합니다. 금액은 예산서 ○쪽 인건비 항목에 있습니다.","정관, 법 제45조","예산서 인건비 항목"],["a4","acct","예산에 없는 돈을 쓰거나 빌린 적이 있나요?","예산으로 정한 것 외에 조합원 부담이 되는 계약이나 자금 차입은 총회 의결을 거쳐야 합니다. 오늘 승인을 요청드리는 것도 그 절차입니다.","법 제45조 제1항","차입·계약 내역"],["c1","ctr","왜 그 업체를 골랐나요? 특혜 아닌가요?","입찰 공고부터 참여 업체, 평가 기준과 점수까지 공개했습니다. 최종 선정은 오늘 조합원 여러분의 투표로 정합니다.","법 제29조, 계약 업무 처리 기준","입찰 공고·업체 비교표"],["c2","ctr","수의계약을 했다는데 괜찮은가요?","계약은 일반경쟁이 원칙이고, 수의계약은 법령이 허용하는 경우(입찰 유찰 등)에만 했으며 그 사유를 기록해 두었습니다.","법 제29조","유찰 기록·수의계약 사유서"],["c3","ctr","업체에서 금품이나 접대를 받은 사람은 없나요?","업체 선정과 관련해 금품·향응을 주고받는 것은 법으로 금지되어 있고 처벌받습니다. 조합은 업체에 서약서를 받고 신고 창구를 두고 있습니다.","법 제132조","청렴 서약서"],["c4","ctr","계약금액이 나중에 늘어나지 않나요?","계약서에 금액 조정 조건을 적었고, 조합원 부담이 늘어나는 변경은 다시 총회 의결을 받습니다.","법 제45조 제1항","계약서 금액 조정 조항"],["m1","money","그래서 제 분담금은 얼마인가요?","정확한 분담금은 감정평가와 관리처분계획에서 확정됩니다. 지금 금액은 추정치이며, 「내 정보 → 분담금 계산」에서 각자 예상치를 보실 수 있습니다.","법 제74조","추정 비례율 자료"],["m2","money","비례율이 떨어지면 어떻게 되나요?","비례율은 (사업 후 총자산 − 총사업비) ÷ 사업 전 종전자산 총액입니다. 공사비·금융비가 늘거나 분양가가 낮아지면 비례율이 떨어지고 분담금이 늘어납니다.","","사업비 항목별 비례율 표"],["m3","money","공사비가 왜 올랐나요?","주된 원인은 물가 변동(자재·인건비)과 설계 변경입니다. 증액 내역과 검증 결과를 비교표로 준비했습니다.","","공사비 증액 내역·검증 자료"],["m4","money","사업은 언제 끝나나요? 이주는 언제인가요?","현재 단계는 ○○이고, 다음 단계(○○)를 ○년 ○월 목표로 진행합니다. 「사업 진행 단계」 메뉴에서 늘 확인하실 수 있습니다.","","단계별 일정표"],["m5","money","권리가액이 무엇인가요?","권리가액은 내 종전 토지·건물의 감정평가액에 비례율을 곱한 금액입니다. 예를 들어 감정평가액 3억 원, 비례율 100%면 권리가액은 3억 원, 비례율 90%면 2억 7천만 원입니다.","법 제74조","비례율 산정 자료"],["m6","money","분담금은 어떻게 계산하나요?","분담금은 「조합원 분양가 − 권리가액」입니다. 권리가액이 분양가보다 많으면 차액을 돌려받고(환급), 적으면 차액을 냅니다. 각자 예상치는 「내 정보 → 분담금 계산」에서 보실 수 있습니다.","법 제74조","평형별 조합원 분양가표"],["m7","money","내 감정평가액은 언제 기준으로 정해지나요?","종전자산은 사업시행계획인가 고시가 있은 날을 기준으로 평가합니다. 평가 결과는 분양 신청 안내 때 개별 통지드립니다.","법 제74조 제1항","종전자산 평가 안내문"],["m8","money","권리가액이 감정평가액보다 적은 이유는 무엇인가요?","비례율이 100%보다 낮기 때문입니다. 사업비가 늘거나 분양 수입이 줄면 비례율이 낮아져 권리가액도 줄어듭니다. 비례율을 높이려면 사업비 절감과 일반분양 수입 확보가 중요합니다.","","사업비 항목별 비례율 표"],["m9","money","분담금은 언제, 어떻게 내나요?","납부 시기와 방법은 관리처분계획과 분양계약에서 정합니다. 보통 계약금·중도금·잔금으로 나누어 냅니다. 우리 조합 일정은 ○○입니다.","관리처분계획·분양계약","분담금 납부 일정표"],["m10","money","관리처분 뒤에 분담금이 또 바뀔 수 있나요?","사업비나 분양 수입이 달라지면 관리처분계획 변경이나 사업이 끝난 뒤 청산 과정에서 금액이 달라질 수 있습니다. 변경이 생기면 총회에서 설명드리고 의결을 받습니다.","법 제74조, 제89조","관리처분계획 변경 대비표"],["m11","money","분담금을 제때 못 내면 어떻게 되나요?","정관과 분양계약에서 정한 연체료 등이 붙을 수 있습니다. 사정이 어려우시면 미리 사무국과 상담해 주세요. 이주비·중도금 대출 안내도 도와드립니다.","정관·분양계약","연체 기준·대출 안내"],["l1","plan","감정평가가 너무 낮게 나왔습니다.","감정평가는 감정평가법인이 법에 따라 합니다. 이의가 있으시면 정해진 절차와 기간 안에 의견을 내실 수 있으며, 방법을 안내드리겠습니다.","법 제74조","의견 제출 안내문"],["l2","plan","분양 신청을 안 하면 어떻게 되나요?","분양 신청 기간에 신청하지 않으면 현금청산 대상이 될 수 있습니다. 기간과 방법은 개별 통지했으며 사무국에서 다시 안내드립니다.","법 제72조, 제73조","분양 신청 안내문"],["o1","off","임원 임기는 언제까지이고 연임하나요?","임원 임기는 정관에 정한 기간(3년 이내)이며, 연임은 정관에 따라 총회 등에서 정합니다.","법 제41조, 정관","임원 명단·임기표"],["o2","off","임원을 해임하려면 어떻게 하나요?","조합원 10분의 1 이상의 요구로 총회를 열어 해임을 의결할 수 있습니다. 구체적인 절차를 안내드리겠습니다.","법 제43조","해임 절차 안내"],["o3","off","정관을 바꾸면 무엇이 달라지나요?","바뀌는 조문은 신·구 대비표로 드렸습니다. 중요한 사항은 더 많은 찬성이 필요하며, 변경 후 구청 인가를 받습니다.","법 제40조","정관 신·구 대비표"],["f1","found","조합 설립에는 동의가 얼마나 필요한가요?","재개발은 토지등소유자 4분의 3 이상과 토지면적 2분의 1 이상의 동의가 필요합니다. 재건축은 동별 구분소유자 과반수와 전체 구분소유자 4분의 3 이상, 토지면적 4분의 3 이상의 동의가 필요합니다. 현재 동의율은 ○%입니다.","법 제35조","동의율 집계표"],["f2","found","창립총회에서는 무엇을 정하나요?","조합 정관 확정, 조합장 등 임원과 대의원 선임 등을 의결합니다. 결과를 갖추어 구청에 조합설립인가를 신청합니다.","시행령 제27조","정관안·임원 후보 명단"],["f3","found","설립 동의를 했는데 철회할 수 있나요?","법령이 정한 시기 전까지는 정해진 방법으로 철회할 수 있습니다. 시기와 방법은 사무국에서 정확히 안내드리겠습니다.","시행령 제33조","동의 철회 안내문"],["f4","found","동의하지 않으면 조합원이 못 되나요?","재건축은 조합 설립에 동의한 사람만 조합원이 됩니다. 재개발은 토지등소유자 모두가 조합원이 됩니다. 재건축에서 동의하지 않은 분께는 법에 따라 매도청구 절차가 진행될 수 있습니다.","법 제39조, 제64조","조합원 자격 안내"],["f5","found","집을 팔면 산 사람이 조합원이 되나요?","일반적으로는 지위가 넘어가지만, 투기과열지구에서는 일정 시점 뒤 매수하면 조합원이 될 수 없고 현금청산 대상이 될 수 있습니다. 예외 사유가 있으니 개별 확인이 필요합니다.","법 제39조 제2항","지위 양도 제한 안내"],["b1","build","시공자는 어떻게 뽑나요?","조합설립인가 후 경쟁입찰로 선정합니다. 입찰이 두 번 이상 유찰된 경우에만 수의계약을 할 수 있습니다. 오늘 총회에서 조합원 투표로 최종 선정합니다.","법 제29조 제4항","입찰 공고·참여 업체 목록"],["b2","build","건설사 직원이 집에 찾아와 홍보합니다. 괜찮나요?","시공자 선정과 관련해 조합원을 개별로 찾아가는 홍보는 금지되어 있습니다. 합동설명회 등 조합이 정한 방법으로만 홍보할 수 있습니다. 위반 사실은 사무국에 알려 주세요. 입찰 자격 박탈 등 제재가 있을 수 있습니다.","정비사업 계약업무 처리기준","홍보 규정·신고 창구"],["b3","build","두 회사 조건을 한눈에 비교할 수 있나요?","공사비, 공사 기간, 마감재, 대안설계, 이주비·사업비 조건, 공사비 인상 조건을 같은 기준으로 비교한 표를 드렸습니다. 홍보 문구가 아니라 입찰서에 적힌 내용 기준입니다.","","입찰 조건 비교표"],["b4","build","오늘 총회는 직접 참석이 얼마나 필요한가요?","시공자 선정 총회는 일반 총회보다 많은 조합원이 직접 참석해야 합니다. 오늘 직접 참석 ○명으로 요건을 충족했습니다.","법 제45조, 정비사업 계약업무 처리기준","직접 참석 집계표"],["b5","build","나중에 공사비를 크게 올리면 어떻게 막나요?","계약서에 공사비 조정 조건을 정하고, 공사비가 일정 비율 이상 늘면 공공기관에 공사비 검증을 요청합니다. 조합원 부담이 늘어나는 변경은 총회 의결을 받습니다.","법 제29조의2, 제45조","공사비 검증 기준"],["s1","biz","사업시행계획은 얼마나 찬성해야 통과되나요?","조합원 과반수 찬성이 필요합니다. 다만 정비사업비가 처음보다 10% 이상 늘어나는 경우에는 조합원 3분의 2 이상이 찬성해야 합니다.","법 제45조 제4항","정비사업비 변경 대비표"],["s2","biz","세대수와 평형 구성은 왜 바뀌었나요?","건축 심의·교통·환경 영향 검토 결과와 용적률 조정에 따라 바뀌었습니다. 변경 전후 비교표를 드렸습니다.","","세대수·평형 변경 대비표"],["s3","biz","임대주택은 왜 지어야 하나요?","법령과 지방자치단체 조례가 정한 비율의 임대주택을 지어야 하는 경우가 있습니다. 우리 구역 비율과 그 대신 받는 용적률 혜택을 설명드리겠습니다.","법 제10조, 제54조","임대주택·용적률 자료"],["s4","biz","사업시행인가가 나면 무엇이 달라지나요?","내 종전자산 감정평가의 기준일이 되고, 분양 신청 절차가 시작됩니다. 분양 신청 기간과 방법은 따로 통지드립니다.","법 제72조, 제74조","다음 단계 일정표"],["l3","plan","관리처분계획을 미리 볼 수 있나요?","인가 신청 전에 30일 이상 공람하고 조합원에게 알립니다. 공람 기간에 의견을 내실 수 있습니다.","법 제78조 제1항","공람 안내문"],["l4","plan","평형은 어떤 기준으로 배정하나요?","정관과 관리처분계획에 정한 기준(희망 평형, 권리가액 순서 등)에 따릅니다. 같은 조건이면 공개 추첨으로 정합니다.","정관·관리처분계획","평형 배정 기준표"],["l5","plan","관리처분계획은 얼마나 찬성해야 통과되나요?","조합원 과반수 찬성이 필요하고, 정비사업비가 10% 이상 늘어나는 경우 3분의 2 이상 찬성이 필요합니다.","법 제45조 제4항","정비사업비 변경 대비표"],["l6","plan","상가 소유자는 무엇을 받나요?","원칙적으로 새 상가를 분양받으며, 정관과 관리처분계획에서 정한 요건을 갖추면 아파트를 받을 수도 있습니다. 개별 상담을 해 드립니다.","정관·관리처분계획","상가 분양 기준"],["v1","move","언제까지 이사해야 하나요?","관리처분계획인가 뒤 조합이 정한 이주 기간 안에 이주하셔야 합니다. 이번 이주 기간은 ○년 ○월 ○일부터 ○월 ○일까지입니다.","법 제81조","이주 일정표"],["v2","move","이주비 대출은 어떻게 받나요?","조합이 정한 금융기관에서 받으실 수 있고, 한도와 금리는 금융기관 심사와 정부 대출 규제에 따라 사람마다 다릅니다. 사무국에서 신청 방법을 안내드립니다.","","이주비 대출 안내"],["v3","move","이사를 안 나가는 사람이 있으면 어떻게 되나요?","관리처분계획인가 고시 뒤에는 종전 건축물을 사용할 수 없습니다. 끝까지 비우지 않으면 조합이 법원 절차(인도 청구 등)를 밟게 되며, 사업이 늦어지는 만큼 비용이 늘 수 있습니다.","법 제81조 제1항","미이주 현황"],["v4","move","세입자는 어떻게 되나요?","재개발 구역의 세입자는 요건에 따라 주거이전비 등 보상을 받거나 임대주택을 신청할 수 있습니다. 재건축은 다를 수 있으니 개별로 확인해 드립니다.","토지보상법, 법 제65조","세입자 안내문"],["e1","close","새 아파트 등기는 언제 되나요?","준공 뒤 이전고시를 하고, 그 뒤 조합이 한꺼번에 소유권 보존등기를 신청합니다.","법 제86조, 제88조","이전고시·등기 일정"],["e2","close","청산금은 무엇인가요?","종전자산 가격과 새로 받은 주택 가격에 차이가 있으면 이전고시 뒤 그 차액을 내거나 돌려받습니다.","법 제89조","청산금 산정표"],["e3","close","조합은 언제 해산하나요?","이전고시 뒤 법이 정한 기간 안에 해산 총회를 열어야 합니다. 해산 뒤에는 청산인이 남은 업무를 마무리합니다.","법 제86조의2","해산·청산 일정"],["e4","close","조합에 남은 돈은 어떻게 나누나요?","모든 채무와 비용을 정리한 뒤 남은 돈은 정관과 총회 의결에 따라 조합원에게 나눕니다. 정산 내역은 공개합니다.","정관, 법 제124조","청산 정산 내역"],["o4","off","조합장 선거는 어떻게 하나요?","정관과 선거관리규정에 따라 선거관리위원회가 후보 등록부터 투표·개표까지 관리합니다. 금품 제공 등 선거 부정은 금지됩니다.","정관·선거관리규정, 법 제132조","선거관리규정"],["o5","off","임원이 될 수 없는 사람은 누구인가요?","법이 정한 결격사유(일정한 형을 받고 기간이 지나지 않은 사람 등)가 있는 사람은 임원이 될 수 없고, 임원이 된 뒤 드러나면 당연히 퇴임합니다.","법 제43조","임원 결격사유 확인서"],["a5","acct","총회 한 번 여는 데 비용이 얼마나 드나요?","장소 대여, 우편 발송, 서면결의서 수거 용역, 진행 인력 등으로 이번 총회에 약 ○원이 들었습니다. 전자투표와 온라인총회를 늘려 이 비용을 줄이고 있습니다.","","총회 비용 내역"],["a6","acct","서면결의서 걷는 용역비가 왜 이렇게 많나요?","성원을 채우려면 서면결의서를 많이 받아야 해서 수거 인력을 썼습니다. 계약 금액과 인원·기간은 계약서로 공개했고, 다음부터는 전자 제출로 줄이겠습니다.","법 제124조","수거 용역 계약서"],["a7","acct","사무실 임대료와 직원 급여는 어디서 보나요?","매월 자금 입출금 세부내역을 다음 달 15일까지 공개합니다. 「조합 정보공개 → 회계 공개」에서 보실 수 있습니다. 개인별 급여는 개인정보라 직급별 합계로 공개합니다.","법 제124조","월별 입출금 내역"],["a8","acct","법률 자문·소송 비용이 왜 많이 나갔나요?","진행 중인 소송 ○건과 자문 ○건 때문입니다. 사건별 내용과 비용, 결과는 정리해 공개했습니다.","","소송·자문 현황표"],["a9","acct","정비사업전문관리업자 용역비는 어떻게 정했나요?","경쟁입찰로 업체를 고르고 총회 의결을 거쳐 계약했습니다. 계약 금액과 지급 내역은 공개되어 있습니다.","법 제29조, 제45조","용역 계약서·지급 내역"],["a10","acct","조합 운영비는 결국 누가 내나요?","운영비도 사업비에 포함되어 결국 조합원 모두가 나눠 부담합니다. 운영비가 늘면 비례율이 낮아지므로 아껴 쓰고 매달 공개합니다.","","운영비 예산 대비 집행표"],["a11","acct","쓰고 남은 예산은 어떻게 되나요?","남은 예산은 다음 해로 넘기거나 사업비에 반영하며, 결산 때 총회 승인을 받습니다.","정관, 법 제45조","결산서"],["a12","acct","빌린 돈의 이자는 얼마인가요?","차입처별 금액, 금리, 기간을 공개했습니다. 현재 차입금 ○원, 연 이자 약 ○원입니다. 예산 외 차입은 총회 의결을 받습니다.","법 제45조 제1항","차입금 현황표"],["a13","acct","설계비·감정평가비 같은 용역비는 얼마나 되나요?","용역별 계약 금액과 지금까지 지급한 금액을 표로 드렸습니다. 모두 입찰 또는 법령이 정한 방법으로 계약했습니다.","법 제29조","용역 계약 현황표"],["a14","acct","이 프로그램 쓰는 비용은 얼마이고 무엇이 줄어드나요?","사용료는 월 ○원입니다. 대신 우편·서면결의 수거·총회 진행 비용이 줄고, 정보공개·회계 공개를 제때 할 수 있습니다. 예상 절감액은 ○원입니다.","","비용 비교표"],["m12","money","총사업비는 얼마이고 어디에 쓰이나요?","총사업비는 약 ○원입니다. 공사비가 ○%로 가장 크고, 금융비용, 보상비, 각종 용역비, 조합 운영비 순입니다. 항목별 표를 드렸습니다.","","총사업비 항목표"],["m13","money","일반분양가가 오르면 분담금이 줄어드나요?","일반분양 수입이 늘면 비례율이 올라 권리가액이 커지고 분담금은 줄어듭니다. 다만 분양가는 시장 상황과 규제에 따라 정해집니다.","","분양가별 비례율 시뮬레이션"],["m14","money","분양가상한제가 적용되나요?","분양가상한제 적용 지역이면 일반분양가가 제한되어 수입이 줄 수 있습니다. 우리 구역은 현재 ○○입니다.","주택법 제57조","적용 여부 확인 자료"],["m15","money","재건축초과이익환수금은 얼마나 나오나요?","재건축 사업에만 해당하며, 「재건축초과이익 환수에 관한 법률」에 따라 사업이 끝난 뒤 부과됩니다. 현재 추정액은 1인당 약 ○원이며, 집값 변동에 따라 크게 달라질 수 있습니다.","재건축초과이익 환수에 관한 법률","부담금 추정 자료"],["m16","money","세금은 얼마나 내야 하나요?","취득세, 양도세 등은 보유 기간, 주택 수, 지역에 따라 사람마다 다릅니다. 조합이 정확한 금액을 말씀드릴 수 없으니 세무 전문가와 상담하시기 바랍니다. 상담 창구를 안내드립니다.","","세무 상담 안내"],["m17","money","이주비 이자는 누가 내나요?","기본 이주비 이자는 조합이 사업비로 부담하고, 추가 이주비 이자는 본인이 부담하는 방식이 많습니다. 우리 조합 조건은 ○○입니다. 조합이 내는 이자도 결국 사업비에 포함됩니다.","관리처분계획","이주비 대출 조건표"],["m18","money","공사비는 3.3㎡(평)당 얼마인가요?","현재 계약 공사비는 3.3㎡당 약 ○만 원입니다. 비슷한 시기·규모 주변 사업과 비교한 자료를 드렸습니다.","","공사비 비교표"],["m19","money","분담금을 줄이려면 어떻게 해야 하나요?","사업 기간을 줄여 이자를 아끼고, 불필요한 비용을 줄이고, 일반분양 수입을 늘리는 것이 가장 효과가 큽니다. 조합원 여러분의 빠른 동의와 이주가 큰 도움이 됩니다.","","비용 절감 계획"],["m20","money","사업이 늦어지면 비용이 얼마나 늘어나나요?","이자 등 금융비용과 운영비로 한 달에 약 ○원이 더 듭니다. 1년 늦어지면 조합원 1인당 약 ○원 부담이 늘어나는 셈입니다.","","지연 비용 계산표"],["m21","money","현금청산을 받으면 얼마나 받나요?","감정평가 금액을 기준으로 협의합니다. 협의가 안 되면 재개발은 수용재결, 재건축은 매도청구 절차로 법원·위원회가 정합니다.","법 제73조","현금청산 절차 안내"],["m22","money","조합원 분양가는 어떻게 정해졌나요?","감정평가와 사업비를 바탕으로 관리처분계획에서 정하며, 총회 의결을 받습니다. 일반분양가보다 낮게 정하는 것이 보통입니다.","법 제74조","평형별 분양가표"],["m23","money","분담금이 너무 커서 감당이 안 됩니다.","분양 평형을 줄이는 방법, 납부 일정, 대출 안내 등 선택할 수 있는 방법을 개별 상담해 드립니다. 현금청산을 선택할 수 있는 시기도 함께 안내드립니다.","","개별 상담 신청서"],["c5","ctr","계약서 원본을 볼 수 있나요?","조합이 맺은 계약서는 작성 후 15일 안에 공개하며, 열람·복사를 청구하실 수 있습니다.","법 제124조","계약서 목록"],["c6","ctr","업체 평가는 누가 했나요?","정해진 기준표에 따라 평가했고, 평가 결과와 점수를 공개했습니다. 최종 선정은 총회에서 조합원이 결정합니다.","정비사업 계약업무 처리기준","평가 기준표·점수표"],["c7","ctr","업체와 계약을 끊으면 위약금을 무나요?","계약서에 정한 해지 사유와 손해배상 조건에 따릅니다. 해지 전에 법률 검토를 받고, 조합원 부담이 생기면 총회에서 결정합니다.","계약서, 법 제45조","계약 해지 검토 의견서"],["p6","proc","집을 여럿이 공동으로 갖고 있으면 투표는 어떻게 하나요?","공동 소유자는 대표자 한 명을 정해 그 대표자가 조합원으로 의결권을 행사합니다. 대표자 선임 동의서를 내 주세요.","법 제39조 제1항","대표자 선임 동의서"],["p7","proc","총회 결과는 언제 알 수 있나요?","개표가 끝나면 현장에서 발표하고, 결과와 의사록은 정해진 기간 안에 정보공개에 올립니다.","법 제124조","개표 결과표"],["p8","proc","오늘 안건을 고쳐서 의결할 수 있나요?","미리 통지하지 않은 안건은 의결하지 않는 것이 원칙입니다. 수정 의견은 기록해 두고 정관에 따라 다음 총회에서 다루겠습니다.","정관","정관 총회 조항"],["p9","proc","총회 내용을 녹음·녹화하나요?","법이 정한 총회는 속기록, 녹음 또는 영상 자료를 만들어 보관합니다. 조합원은 열람을 청구할 수 있습니다.","법 제125조","녹음·영상 보관 안내"],["o6","off","조합장 보수를 왜 올리나요?","인상 이유와 다른 조합 사례를 비교한 자료를 드렸습니다. 보수는 총회에서 승인한 예산 안에서만 지급합니다.","정관, 법 제45조","보수 비교표"],["o7","off","대의원회는 무엇을 하나요?","조합원 수가 많은 조합은 대의원회를 두고, 총회 권한 중 법이 허용한 일부를 대신 처리합니다. 중요한 사항은 반드시 총회에서 정합니다.","법 제46조","대의원 명단"],["d3","disc","내 이름이나 연락처가 공개되나요?","공개 자료에서는 주민등록번호, 연락처 등 개인정보를 뺍니다. 명부는 법이 허용한 범위에서만 쓰입니다.","법 제124조 제3항, 개인정보 보호법","개인정보 처리 안내"],["b6","build","시공사가 부도나면 어떻게 하나요?","입찰 때 신용등급과 시공 실적을 확인했고, 계약서에 이행보증을 받도록 했습니다. 만일의 경우 보증기관을 통해 공사를 이어갑니다.","계약서","신용평가·보증서 사본"],["s5","biz","입주까지 얼마나 걸리나요?","다음 단계 인가가 예정대로 나면 착공 후 약 ○년, 입주는 ○년 ○월 예정입니다. 인허가와 이주 속도에 따라 달라질 수 있습니다.","","전체 일정표"],["v5","move","이사 비용도 지원되나요?","재개발은 요건을 갖춘 분께 법령에 따른 이사비·주거이전비가 지급될 수 있습니다. 재건축은 조합 결정에 따릅니다. 대상 여부를 개별 확인해 드립니다.","토지보상법, 관리처분계획","이사비 지급 기준"],["e5","close","입주 뒤 하자가 생기면 누가 고치나요?","시공사가 법에 정한 하자담보책임 기간 동안 보수합니다. 입주 때 하자 접수 방법을 안내드립니다.","공동주택관리법","하자 접수 안내"],["m24","money","비례율이 정확히 무엇인가요?","비례율은 사업이 끝났을 때 남는 순이익을 조합원 종전자산 총액으로 나눈 비율입니다. 계산식은 (분양 수입 총액 − 총사업비) ÷ 종전자산 평가 총액 × 100입니다. 100%보다 높으면 조합원에게 유리합니다.","","비례율 계산표"],["m25","money","우리 조합 비례율은 지금 몇 %인가요?","현재 추정 비례율은 ○%입니다. 확정 비례율은 관리처분계획에서 정해지며, 사업비와 분양 수입이 바뀌면 다시 달라질 수 있습니다.","법 제74조","추정 비례율 자료"],["m26","money","비례율이 1% 떨어지면 내 분담금은 얼마나 늘어나나요?","권리가액이 종전자산 평가액의 1%만큼 줄어듭니다. 예를 들어 평가액이 3억 원이면 권리가액이 300만 원 줄고, 그만큼 분담금이 늘어납니다.","","비례율 변동 영향표"],["m27","money","비례율이 100%가 넘으면 무엇이 좋은가요?","권리가액이 감정평가액보다 커져서 분담금이 줄거나 환급이 커집니다. 다만 추정치이므로 사업비가 늘면 떨어질 수 있습니다.","","비례율 시뮬레이션"],["m28","money","옆 동네보다 우리 비례율이 낮은 이유는 무엇인가요?","비례율은 종전자산 평가 수준, 사업비, 일반분양 물량과 분양가에 따라 크게 달라서 단순 비교가 어렵습니다. 같은 기준으로 비교한 자료를 드렸습니다.","","주변 구역 비교표"],["m29","money","감정평가를 낮게 하면 비례율이 높아진다던데 맞나요?","종전자산 평가가 낮아지면 비례율 숫자는 올라가지만 권리가액은 평가액 × 비례율이라 실제 이익이 늘어나는 것은 아닙니다. 중요한 것은 분양가와 권리가액의 차이, 즉 분담금입니다.","","설명 예시표"],["m30","money","내 권리가액과 남의 권리가액이 왜 다른가요?","권리가액은 각자의 토지·건물 감정평가액에 같은 비례율을 곱하므로, 땅 면적·위치·건물 상태에 따라 사람마다 다릅니다.","법 제74조","개인별 권리가액 통지서"],["m31","money","분담금 추정액이 처음 들은 것과 다릅니다.","처음 금액은 조합 설립 단계의 추정치였고, 그 뒤 공사비·금리·분양가 변화로 바뀌었습니다. 무엇이 얼마나 바뀌었는지 항목별로 비교해 드리겠습니다.","","분담금 변동 내역표"],["m32","money","분담금이 최종 확정되는 때는 언제인가요?","관리처분계획에서 정하지만, 사업이 끝난 뒤 실제 사업비로 정산하므로 청산 때 최종 확정됩니다.","법 제74조, 제89조","단계별 확정 시기표"],["m33","money","중도금 대출 이자는 누가 내나요?","분양계약에서 정합니다. 조합이 이자를 대신 내는 무이자 방식, 입주 때 한꺼번에 내는 이자 후불 방식, 본인이 바로 내는 방식이 있습니다. 우리 조합은 ○○ 방식입니다.","분양계약","중도금 대출 조건표"],["m34","money","중도금 무이자라면 정말 공짜인가요?","조합원이 직접 내지 않을 뿐 조합이 이자를 사업비로 부담하므로, 결국 비례율과 분담금에 반영됩니다.","","중도금 이자 부담 구조"],["m35","money","이자 후불제는 언제 얼마를 내나요?","입주(잔금) 때 그동안 쌓인 중도금 이자를 한꺼번에 냅니다. 금리에 따라 달라지며, 현재 금리 기준 예상액은 약 ○원입니다.","분양계약","이자 후불 예상액표"],["m36","money","중도금 대출이 안 나오면 어떻게 하나요?","정부 대출 규제나 개인 신용 때문에 대출이 어려울 수 있습니다. 이 경우 직접 납부하거나 다른 금융기관을 알아보셔야 하며, 사무국에서 상담해 드립니다. 연체되면 분양계약에 정한 연체료가 붙을 수 있습니다.","분양계약","대출 대체 방안 안내"],["m37","money","사업비 대출 이자는 얼마나 나가나요?","현재 사업비 대출 잔액은 ○원, 금리 연 ○%로 한 달 이자가 약 ○원입니다. 이 이자는 모두 사업비라 조합원 전체가 부담합니다.","","사업비 대출 현황표"],["m38","money","금리가 오르면 분담금에 얼마나 영향이 있나요?","금리가 1%포인트 오르면 사업비 대출 이자가 1년에 약 ○원 늘어나고, 조합원 1인당 약 ○원 부담이 늘어나는 셈입니다.","","금리 변동 영향표"],["m39","money","시공사가 빌려준 돈에도 이자가 붙나요?","시공사 대여금은 계약서에 정한 금리로 이자가 붙거나 무이자 조건일 수 있습니다. 우리 조합 조건은 ○○이며 계약서에서 확인하실 수 있습니다.","계약서","시공사 대여금 조건표"],["m40","money","사업비 대출(프로젝트 대출)은 왜 필요한가요?","사업비를 마련하려고 앞으로의 분양 수입 등을 바탕으로 받는 대출입니다. 금리와 수수료는 사업비가 되므로 조건을 비교해 가장 유리한 곳을 고릅니다. 예산 외 차입은 총회 의결을 받습니다.","법 제45조 제1항","대출 조건 비교표"],["m41","money","이자를 줄이려면 어떻게 해야 하나요?","더 낮은 금리로 갈아타기, 필요한 만큼만 나눠 빌리기, 사업 기간 단축이 효과가 큽니다. 갈아타기 비용과 효과를 비교해 보고 드리겠습니다.","","대출 갈아타기 검토서"],["m42","money","이주비 이자와 중도금 이자는 무엇이 다른가요?","이주비 이자는 공사 중 살 집을 구하려고 빌린 돈의 이자이고, 중도금 이자는 새 아파트 분양대금 일부를 빌린 돈의 이자입니다. 누가 부담하는지는 각각 관리처분계획과 분양계약에서 정합니다.","관리처분계획·분양계약","이자 구분 안내표"],["m43","money","분담금을 한꺼번에 미리 내면 할인되나요?","정관이나 분양계약에 선납 할인 규정이 있으면 할인받을 수 있습니다. 우리 조합은 ○○입니다.","정관·분양계약","선납 조건 안내"],["m44","money","분담금 대신 집 크기를 줄일 수 있나요?","분양 신청 때 더 작은 평형을 신청하면 분담금이 줄거나 환급받을 수 있습니다. 평형 변경 가능 시기와 방법을 안내드립니다.","법 제72조","평형별 분담금표"],["m45","money","환급금은 언제 받나요?","권리가액이 분양가보다 많은 분은 관리처분계획과 분양계약에서 정한 시기에 받습니다. 최종 금액은 청산 때 정산됩니다.","법 제89조","환급 일정표"],["p10","proc","온라인으로 참석하면 직접 출석으로 인정되나요?","법과 정관이 정한 방식(본인확인·실시간 참여 등)을 갖춘 온라인 참석은 출석으로 볼 수 있습니다. 오늘 온라인 참석 ○명을 포함했습니다.","법 제45조, 정관","온라인 참석 기록"],["p11","proc","투표 결과가 의심스럽습니다. 다시 셀 수 있나요?","개표 과정은 참관인이 지켜봤고 투표 기록을 보관하고 있습니다. 정식으로 요청하시면 열람 방법을 안내드립니다.","법 제124조","개표 참관 기록"],["p12","proc","총회는 누가 소집하나요?","조합장이 정관에 따라 소집합니다. 조합원 5분의 1 이상이 요구하면 열어야 하며, 임원 해임은 10분의 1 이상 요구로 열 수 있습니다.","법 제44조, 제43조","소집 절차 안내"],["p13","proc","몸이 불편해서 현장에 못 갑니다.","서면결의서 제출, 전자투표, 온라인 참석, 대리인 출석 중 편한 방법을 고르실 수 있습니다. 방법은 사무국에서 도와드립니다.","법 제45조","참여 방법 안내문"],["p14","proc","투표용지를 잘못 적었습니다.","정관과 총회 운영 규정에 따라 처리합니다. 접수처에서 바로 확인해 드립니다.","정관·총회 운영 규정","투표용지 처리 기준"],["p15","proc","총회가 무효라고 소송하면 어떻게 되나요?","절차를 법과 정관대로 지켰다는 기록(소집 통지, 성원, 투표 기록)을 모두 보관하고 있습니다. 소송이 제기되면 법원 판단에 따릅니다.","법 제44조, 제45조","총회 절차 기록 일체"],["f6","found","추진위원회에서 쓴 돈은 누가 부담하나요?","조합이 설립되면 추진위원회의 업무와 비용, 계약을 조합이 넘겨받습니다. 결국 사업비에 포함됩니다.","법 제34조","추진위 회계 인계 자료"],["f7","found","추진위원회 회계는 공개되나요?","추진위원회 회계와 계약 자료를 조합에 넘기고, 조합원에게 공개합니다.","법 제34조, 제124조","추진위 결산서"],["f8","found","조합장 후보는 어떻게 정하나요?","정관과 선거관리규정에 따라 후보 등록을 받고, 창립총회에서 투표로 선임합니다.","정관","후보 등록 공고"],["f9","found","정관에는 무엇이 들어가나요?","조합원 자격, 임원 수와 임기, 총회 운영, 비용 부담, 회계 등 법이 정한 사항이 들어갑니다. 표준정관과 다른 부분을 표시해 드렸습니다.","법 제40조","정관안·표준정관 대비표"],["f10","found","조합설립인가는 언제 나오나요?","창립총회 뒤 서류를 갖추어 구청에 신청하며, 심사 기간이 걸립니다. 예상 시기는 ○월입니다.","법 제35조","인가 신청 일정"],["f11","found","동의서를 냈는데 내용이 바뀌면요?","설립 동의 사항 중 중요한 내용이 바뀌면 법령에 따라 다시 동의를 받아야 하는 경우가 있습니다. 해당 여부를 확인해 안내드립니다.","법 제35조","변경 동의 검토"],["f12","found","토지만 있고 건물은 없어도 조합원인가요?","재개발은 토지만 가진 분도 토지등소유자로 조합원이 될 수 있습니다. 재건축은 건축물과 그 부속토지를 함께 가진 분이 대상입니다. 개별 확인이 필요합니다.","법 제2조, 제39조","조합원 자격 확인표"],["f13","found","여러 채를 갖고 있으면 조합원 자격이 여러 개인가요?","한 사람이 여러 채를 갖고 있어도 원칙적으로 조합원 1명으로 봅니다. 분양받을 수 있는 주택 수는 법과 관리처분계획에 따라 정해집니다.","법 제39조, 제76조","다주택자 안내"],["f14","found","창립총회 비용은 얼마나 드나요?","장소, 우편, 서면결의 수거 등으로 약 ○원이 예상됩니다. 전자 방식을 쓰면 줄일 수 있습니다.","","창립총회 예산"],["f15","found","설립 뒤 바로 무엇을 하나요?","인가를 받으면 법인 등기를 하고, 정비사업전문관리업자·설계자 선정과 시공자 선정 준비를 시작합니다.","법 제38조","설립 후 일정표"],["b7","build","입찰에 왜 한 회사만 들어왔나요?","공고 조건과 시장 상황 때문입니다. 입찰이 두 번 이상 유찰되면 법에 따라 수의계약을 검토할 수 있습니다.","법 제29조 제4항","입찰 경과 보고"],["b8","build","시공사가 약속한 조건을 나중에 안 지키면요?","입찰서에 적은 조건은 계약서에 넣습니다. 지키지 않으면 계약서에 따라 책임을 묻습니다.","계약서","입찰서·계약서 대비표"],["b9","build","특화 설계는 공짜인가요?","입찰서에 「공사비 포함」인지 「별도 비용」인지 적혀 있습니다. 별도 비용이면 공사비가 늘어납니다. 항목별로 확인해 드렸습니다.","","특화 항목 비용표"],["b10","build","물가가 오르면 공사비가 자동으로 오르나요?","계약서의 물가 변동 조정 조항에 따릅니다. 조정 기준과 한도를 확인해 드렸으며, 조합원 부담이 늘면 총회 의결을 받습니다.","계약서, 법 제45조","물가 조정 조항"],["b11","build","공사 기간이 늘어나면 손해는 누가 보나요?","시공사 잘못으로 늦어지면 계약서에 정한 지체상금을 받습니다. 조합 사정으로 늦어지면 조합이 부담할 수 있습니다.","계약서","지체상금 조항"],["b12","build","아파트 이름(브랜드)은 어떻게 정하나요?","입찰 조건과 계약에 따릅니다. 고급 브랜드 적용 조건과 추가 비용 여부를 확인해 드렸습니다.","계약서","브랜드 적용 조건"],["b13","build","시공사 선정을 취소할 수 있나요?","계약 해지 사유가 있으면 총회 의결로 취소할 수 있지만, 손해배상과 사업 지연 위험이 있어 법률 검토가 먼저 필요합니다.","법 제45조, 계약서","해지 검토 의견서"],["b14","build","두 회사가 함께 짓는 건 무엇이 다른가요?","공동 시공은 책임을 나누어 지는 방식입니다. 각 회사의 지분과 책임 범위, 하자 책임을 계약서에서 확인해 드렸습니다.","계약서","공동도급 협정서"],["b15","build","시공사에서 받은 선물을 돌려줘야 하나요?","네. 시공자 선정과 관련한 금품·향응은 받아도 안 되고, 받으면 처벌 대상이 될 수 있습니다. 사무국에 신고해 주세요.","법 제132조","신고 창구 안내"],["s6","biz","설계가 바뀌면 다시 총회를 하나요?","법령에서 정한 경미한 변경이 아니면 사업시행계획 변경으로 총회 의결과 구청 인가를 받습니다.","법 제50조, 제45조","변경 대비표"],["s7","biz","층수와 동 배치는 왜 이렇게 정했나요?","건축 심의, 일조·조망, 교통 검토 결과에 따랐습니다. 다른 안과 비교한 자료를 드렸습니다.","","배치 비교안"],["s8","biz","도로·공원을 왜 기부채납해야 하나요?","정비계획에서 정한 도로·공원 등 기반시설을 만들어 넘기는 것으로, 그 대신 용적률 완화 등을 받습니다.","정비계획","기부채납 내역"],["s9","biz","교통·환경 영향 평가는 끝났나요?","현재 ○○ 단계입니다. 결과에 따라 설계가 바뀔 수 있습니다.","","심의 경과표"],["s10","biz","커뮤니티 시설은 무엇이 들어가나요?","계획된 시설 목록과 면적을 드렸습니다. 추가하면 공사비가 늘어나므로 비용과 함께 검토합니다.","","커뮤니티 시설 계획"],["s11","biz","주차는 세대당 몇 대인가요?","세대당 약 ○대로 계획했습니다. 법정 기준과 비교한 자료를 드렸습니다.","","주차 계획"],["s12","biz","사업시행인가가 늦어지면 어떻게 되나요?","인가가 늦어질수록 금융비용이 늘어납니다. 보완 요청 내용과 대응 일정을 알려 드립니다.","","인가 진행 현황"],["s13","biz","정비사업비 추산액이 왜 늘었나요?","공사비 물가 상승, 설계 변경, 금리 상승이 주된 이유입니다. 항목별 증감표를 드렸습니다.","법 제45조 제4항","정비사업비 증감표"],["s14","biz","소형 평형을 꼭 지어야 하나요?","법령과 조례가 정한 주택 규모별 건설 비율이 있는 경우 따라야 합니다. 우리 구역 기준을 안내드립니다.","법령·조례","주택 규모별 비율표"],["s15","biz","사업시행계획에 반대 의견을 낼 수 있나요?","총회에서 의견을 말씀하시거나, 인가 과정의 공람 기간에 구청에 의견을 내실 수 있습니다.","법 제56조","공람 안내"],["l7","plan","분양 신청 기간은 언제인가요?","사업시행인가 고시 뒤 통지하며, 법이 정한 기간 동안 신청을 받습니다. 이번 기간은 ○월 ○일부터 ○월 ○일까지입니다.","법 제72조","분양 신청 통지서"],["l8","plan","분양 신청 기간을 놓치면 어떻게 되나요?","현금청산 대상이 될 수 있습니다. 놓치지 않도록 개별 통지와 문자 안내를 드립니다.","법 제72조, 제73조","미신청자 안내"],["l9","plan","한 사람이 두 채를 받을 수 있나요?","법이 정한 요건(종전 주택 가격·면적 등)을 갖추면 2주택을 받을 수 있는 경우가 있습니다. 해당 여부를 개별 확인해 드립니다.","법 제76조","2주택 분양 기준"],["l10","plan","동·호수는 어떻게 정하나요?","관리처분계획에 정한 방법에 따라 공개 추첨으로 정합니다. 조합원이 일반분양자보다 먼저 배정받는 것이 보통입니다.","관리처분계획","동호수 추첨 방법"],["l11","plan","감정평가는 누가 하나요?","법령에 따라 시장·군수 등이 선정한 감정평가법인과 조합이 선정한 감정평가법인이 평가합니다.","법 제74조","감정평가법인 선정 내역"],["l12","plan","관리처분계획인가가 나면 무엇이 달라지나요?","이주가 시작되고 종전 건축물을 사용할 수 없게 됩니다. 분양 계약과 이주비 대출 일정도 이어집니다.","법 제81조","다음 단계 일정"],["l13","plan","관리처분계획에 이의가 있으면 어떻게 하나요?","공람 기간에 의견을 내시고, 인가 뒤에는 법원 소송 절차가 있습니다. 개별 상담해 드립니다.","법 제78조","의견 제출 양식"],["l14","plan","종전 건물이 오래돼서 평가가 낮습니다.","감정평가는 토지와 건물을 함께 평가하며 건물 연식이 반영됩니다. 평가 근거를 개별로 설명해 드립니다.","법 제74조","개별 평가 근거"],["l15","plan","일반분양은 언제 하나요?","분양 승인을 받아 진행합니다. 예정 시기는 ○년 ○월입니다.","주택법","일반분양 계획"],["v6","move","이주비는 얼마까지 빌릴 수 있나요?","기본 이주비는 종전자산 평가액의 일정 비율로 정하지만, 정부 대출 규제에 따라 사람마다 한도가 다릅니다. 개별 한도는 금융기관 심사로 정해집니다.","관리처분계획","이주비 한도 안내"],["v7","move","이주비는 언제 갚나요?","보통 입주 때 갚습니다. 상환 시기와 방법은 대출 약정에 따릅니다.","대출 약정","이주비 상환 안내"],["v8","move","전세 세입자 보증금은 어떻게 돌려주나요?","소유자가 이주비 등으로 돌려주셔야 합니다. 보증금 반환 일정이 이주에 영향을 주므로 미리 준비해 주세요.","","세입자 이주 안내"],["v9","move","이주 기간에 짐 보관은 어떻게 하나요?","개인이 준비하셔야 하며, 조합이 업체 정보를 안내해 드릴 수 있습니다.","","보관 업체 안내"],["v10","move","철거는 언제 시작하나요?","이주가 끝나고 해체 허가·석면 조사 등을 마친 뒤 시작합니다. 예정 시기는 ○월입니다.","","철거 일정"],["v11","move","석면 같은 위험물은 어떻게 처리하나요?","법에 따라 조사하고 허가받은 업체가 안전하게 제거합니다.","석면안전관리법","석면 조사 결과"],["v12","move","빈집 관리(안전·범죄)는 누가 하나요?","이주 기간에는 조합이 경비·순찰과 출입 통제를 합니다.","","빈집 관리 계획"],["v13","move","이주 기간에 주소·연락처는 어떻게 하나요?","이사 후 전입신고를 하시고 조합에 새 연락처를 알려 주세요. 조합 안내는 문자·앱으로 보냅니다.","","연락처 변경 신청서"],["v14","move","이주가 늦어지면 비용이 얼마나 늘어나나요?","한 달 늦어질 때마다 금융비용 등 약 ○원이 늘어 조합원 전체 부담이 됩니다.","","지연 비용 계산표"],["v15","move","상가 세입자는 어떻게 되나요?","재개발은 요건에 따라 영업손실 보상 등을 받을 수 있습니다. 개별 확인이 필요합니다.","토지보상법","상가 세입자 안내"],["e6","close","준공 뒤 입주는 어떻게 하나요?","입주 기간을 정해 잔금·분담금 정산을 마친 뒤 열쇠를 받습니다. 입주 안내문을 드립니다.","","입주 안내문"],["e7","close","청산 때 추가 분담금이 나올 수 있나요?","실제 사업비가 계획보다 많으면 추가 부담이, 적으면 환급이 생길 수 있습니다. 정산 내역은 공개합니다.","법 제89조","청산 정산 내역"],["e8","close","청산금은 나눠 낼 수 있나요?","정관이나 총회 의결로 분할 납부를 정할 수 있습니다.","법 제89조, 정관","분할 납부 기준"],["e9","close","청산금을 안 내면 어떻게 되나요?","법에 따라 강제 징수 절차가 진행될 수 있습니다. 어려우시면 미리 상담해 주세요.","법 제90조","청산금 납부 안내"],["e10","close","조합이 해산하면 소송은 누가 맡나요?","청산인이 남은 소송과 채무 정리를 맡습니다.","","청산인 업무 범위"],["e11","close","청산인은 누가 되나요?","정관이나 총회 결의로 정합니다.","정관","청산인 선임 안건"],["e12","close","조합 서류는 어디로 가나요?","법에 따라 정비사업 관련 서류를 시장·군수 등에게 넘깁니다.","법 제125조","서류 인계 목록"],["e13","close","등기 전에 집을 팔 수 있나요?","이전고시 뒤 등기 전에는 거래에 제약이 있을 수 있습니다. 법무사와 상담하시길 권합니다.","","등기 일정 안내"],["e14","close","해산을 미루면 문제가 되나요?","이전고시 뒤 법이 정한 기간 안에 해산하지 않으면 시장·군수 등이 조치할 수 있고, 운영비가 계속 나갑니다.","법 제86조의2","해산 일정"],["e15","close","남은 조합 비품·사무실은 어떻게 하나요?","처분해 정산에 반영하고, 내역을 공개합니다.","","자산 처분 내역"],["a15","acct","결산서는 어디서 볼 수 있나요?","총회 자료와 「조합 정보공개」에 올려 두었고, 열람·복사를 청구하실 수 있습니다.","법 제124조","결산서"],["c8","ctr","같은 업체와 계속 계약하는 이유는 무엇인가요?","계약마다 입찰을 거쳤고 그 결과 같은 업체가 선정되었습니다. 입찰 기록을 공개했습니다.","법 제29조","입찰 기록"],["c9","ctr","임원 친인척 회사와 계약했나요?","임원과 이해관계가 있는 업체와의 계약 여부를 확인했고, 해당 사항은 ○○입니다. 이해관계가 있으면 그 임원은 의결에서 빠집니다.","정관","이해관계 확인서"],["c10","ctr","전자입찰(나라장터 등)로 하나요?","법령에 따라 일정 금액 이상 계약은 전자조달시스템으로 입찰합니다.","법 제29조","전자입찰 공고"],["c11","ctr","계약 금액이 나중에 바뀐 적이 있나요?","변경 계약 목록과 사유를 공개했습니다. 조합원 부담이 늘어난 변경은 총회 의결을 받았습니다.","법 제45조","변경 계약 목록"],["c12","ctr","변호사·세무사는 어떻게 골랐나요?","견적과 경력을 비교해 선정했고 계약서를 공개했습니다.","법 제29조","선정 비교표"],["c13","ctr","용역 결과물은 볼 수 있나요?","용역 보고서 등 결과물도 공개 대상이며 열람을 청구하실 수 있습니다.","법 제124조","용역 결과물 목록"],["c14","ctr","계약업체가 일을 제대로 안 하면요?","계약서에 정한 대로 시정 요구, 대금 감액, 해지 등을 검토합니다.","계약서","이행 점검 기록"],["c15","ctr","소액 계약도 입찰하나요?","법령이 정한 금액 이하는 수의계약이 허용되지만, 견적 비교 등 기록을 남깁니다.","법 제29조","소액 계약 내역"],["o8","off","임원이 일을 잘못하면 누가 감시하나요?","감사가 업무와 회계를 감사하고, 조합원은 정보공개 청구와 총회로 확인할 수 있습니다. 구청도 감독합니다.","법 제113조, 정관","감사 보고서"],["o9","off","조합장이 갑자기 그만두면 누가 대신하나요?","정관에 정한 대로 이사 중 한 명이 직무를 대행하고, 새 조합장을 뽑습니다.","정관","직무대행 규정"],["o10","off","임원은 꼭 조합원이어야 하나요?","법령과 정관이 정한 요건(거주·소유 기간 등)을 갖춘 조합원이어야 합니다.","법 제41조","임원 자격 요건"],["o11","off","이사회는 무엇을 하나요?","총회에 올릴 안건을 정하고 조합의 일상 업무를 결정합니다. 의사록은 공개합니다.","정관, 법 제124조","이사회 의사록"],["o12","off","임원 보수 외에 수당이 있나요?","회의 참석 수당 등은 예산과 규정에 정한 범위에서만 지급하며 회계 공개에 나옵니다.","정관","수당 지급 규정"],["o13","off","감사는 무슨 일을 하나요?","조합 재산과 업무를 감사하고 결과를 총회에 보고합니다.","정관","감사 보고서"],["o14","off","정관 변경에는 얼마나 찬성이 필요한가요?","일반 사항은 조합원 과반수, 조합원 자격·비용 분담 등 중요한 사항은 3분의 2 이상 찬성이 필요하고 구청 인가를 받습니다.","법 제40조","정관 변경 안건"],["o15","off","임원이 업체와 따로 만나도 되나요?","공식 절차 밖에서 업체와 접촉하는 것은 오해를 부를 수 있어 조합 규정으로 제한합니다. 금품을 받으면 처벌 대상이 될 수 있습니다.","법 제132조","윤리 규정"],["d4","disc","어떤 자료가 공개되나요?","정관, 총회·이사회 의사록, 계약서, 회계 자료, 관리처분계획 등 법이 정한 자료를 공개합니다.","법 제124조 제1항","공개 항목 목록"],["d5","disc","복사비는 내나요?","실비 범위에서 복사비를 받을 수 있습니다. 금액 기준을 안내드립니다.","법 제124조","복사비 기준"],["d6","disc","인터넷으로도 볼 수 있나요?","이 프로그램의 「조합 정보공개」와 정비사업 정보 누리집에서 볼 수 있습니다.","법 제124조","공개 위치 안내"],["d7","disc","공개가 늦으면 어떻게 하나요?","공개 기한을 넘기면 처벌 대상이 될 수 있어 일정 알림을 두고 관리합니다. 늦은 자료가 있으면 알려 주세요.","법 제124조, 제138조","공개 일정표"],["d8","disc","분기마다 무엇을 알려 주나요?","분기가 끝난 다음 달 15일까지 공개 자료 목록과 열람 방법을 조합원에게 알려 드립니다.","법 제124조","분기 통지문"],["d9","disc","조합원 명부도 볼 수 있나요?","명부는 개인정보가 들어 있어 법이 허용한 범위에서만 열람·복사할 수 있고, 주민등록번호 등은 가립니다.","법 제124조 제3항, 개인정보 보호법","명부 열람 기준"],["d10","disc","구청에 낸 서류도 볼 수 있나요?","인가 신청서 등 조합이 작성한 서류는 공개 대상입니다. 열람 방법을 안내드립니다.","법 제124조","제출 서류 목록"],["d11","disc","총회 녹음 파일을 받을 수 있나요?","총회 녹음·영상은 열람을 청구하실 수 있습니다. 다른 사람의 개인정보가 담긴 부분은 처리 방법을 따로 정합니다.","법 제125조","열람 신청서"],["d12","disc","자료 열람을 거부당하면 어디에 알리나요?","구청 담당 부서에 알릴 수 있습니다. 조합은 거부 없이 처리하겠습니다.","법 제124조","구청 연락처"],["d13","disc","공개 자료를 다른 사람에게 줘도 되나요?","공개 자료는 볼 수 있지만, 다른 사람의 개인정보가 담긴 자료를 퍼뜨리면 개인정보 보호법 위반이 될 수 있습니다.","개인정보 보호법","이용 주의 안내"],["d14","disc","회계 자료를 엑셀로 받을 수 있나요?","가능한 형식으로 드리겠습니다. 「회계 공개」에서 내려받을 수 있습니다.","","회계 공개 화면"],["d15","disc","공개 자료가 틀린 것 같습니다.","알려 주시면 확인해 고치고, 고친 내용을 함께 공개합니다.","","정정 공고"
