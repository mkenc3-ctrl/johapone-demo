<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도시정비법 찾기</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1f23; --muted: #6b7078; --line: #e2e0d9;
    --accent: #1f5f8b; --accent-soft: #e6eff5; --mark: #ffe58a; --note: #8a6d1f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181c; --panel: #1e2126; --ink: #e8e9eb; --muted: #9499a1; --line: #2e3238;
      --accent: #7db8de; --accent-soft: #23323d; --mark: #6b5a12; --note: #cdb265; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
      --bg: #16181c; --panel: #1e2126; --ink: #e8e9eb; --muted: #9499a1; --line: #2e3238;
      --accent: #7db8de; --accent-soft: #23323d; --mark: #6b5a12; --note: #cdb265; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.7 "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 16px; }
  .top { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; max-width: 1280px; margin: 0 auto; }
  h1 { font-size: 17px; margin: 0; white-space: nowrap; }
  #q {
    flex: 1; min-width: 200px; padding: 9px 12px; font: inherit; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  }
  #q:focus, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tabs button, .chip {
    font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  .tabs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }
  .hint { max-width: 1280px; margin: 6px auto 0; font-size: 12.5px; color: var(--muted); }
  main { flex: 1; min-height: 0; display: flex; max-width: 1280px; width: 100%; margin: 0 auto; }
  nav {
    width: 300px; flex: none; overflow-y: auto; border-right: 1px solid var(--line);
    padding: 10px 8px 40px; font-size: 13.5px;
  }
  nav .ch { font-weight: 700; color: var(--muted); padding: 10px 8px 2px; font-size: 12.5px; }
  nav a {
    display: block; padding: 3px 8px; border-radius: 6px; color: var(--ink); text-decoration: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  nav a:hover { background: var(--accent-soft); }
  nav a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  nav a .star { color: var(--note); }
  #view { flex: 1; min-width: 0; overflow-y: auto; padding: 16px 20px 80px; }
  .status { color: var(--muted); font-size: 13.5px; margin-bottom: 10px; }
  article {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 18px; margin-bottom: 12px;
  }
  article h2 { font-size: 16px; margin: 0 0 6px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  article h2 .law { font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 1px 8px; border-radius: 999px; }
  article h2 .sp { flex: 1; }
  article h2 button, article h2 a { font: inherit; font-size: 12.5px; font-weight: 400; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 0; text-decoration: underline; }
  article p { margin: 2px 0; overflow-wrap: anywhere; }
  .lv1 { padding-left: 1.4em; } .lv2 { padding-left: 2.8em; } .lv3 { padding-left: 4.2em; }
  .note { color: var(--note); font-size: 13px; }
  mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
  .ref { color: var(--accent); cursor: pointer; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; }
  .rel { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 13.5px; }
  .rel b { color: var(--muted); font-weight: 600; margin-right: 6px; }
  .rel .chip { font-size: 13px; padding: 2px 10px; margin: 2px 4px 2px 0; }
  .more { display: block; margin: 16px auto; }
  footer { font-size: 12px; color: var(--muted); padding: 8px 16px; border-top: 1px solid var(--line); background: var(--panel); text-align: center; }
  footer a { color: inherit; }
  .ex { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .ex .chip { text-align: left; }
  .msg { margin-bottom: 22px; scroll-margin-top: 150px; }
  .uq { margin: 0 0 10px auto; width: fit-content; max-width: 85%; background: var(--accent); color: var(--panel); padding: 8px 14px; border-radius: 14px 14px 2px 14px; overflow-wrap: anywhere; }
  .ai { background: var(--panel); border: 1px solid var(--accent); border-radius: 10px; padding: 12px 16px; margin-bottom: 10px; }
  .ai .tag { font-size: 12px; color: var(--accent); }
  .aitext { overflow-wrap: anywhere; }
  .sub { font-size: 13.5px; color: var(--muted); margin: 14px 0 6px; }
  .hit { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; margin-bottom: 6px; }
  .hit summary { cursor: pointer; overflow-wrap: anywhere; }
  .hit .law { font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 1px 8px; border-radius: 999px; }
  .hit .snip { display: block; color: var(--muted); font-size: 13.5px; }
  .hit .note { font-size: 13px; }
  .hit p { margin: 4px 0; overflow-wrap: anywhere; }
  .hit a { color: var(--accent); }
  .composer { display: flex; gap: 8px; align-items: flex-end; margin-top: 8px; }
  #askBox { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; resize: vertical; }
  #askBox:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .send { background: var(--accent); border-color: var(--accent); color: var(--panel); padding: 10px 16px; white-space: nowrap; }
  #navToggle { display: none; }
  @media (max-width: 800px) {
    #navToggle { display: inline-block; }
    nav { display: none; position: fixed; inset: 0 20% 0 0; z-index: 5; background: var(--panel); width: auto; box-shadow: 0 0 0 100vmax rgba(0,0,0,.35); }
    nav.open { display: block; }
    #view { padding: 12px 16px 40px; overflow: visible; }
    /* phones: the whole page scrolls, so results stay visible while the keyboard is open */
    html, body { height: auto; }
    body { display: block; }
    main { display: block; }
    header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; padding: 8px 16px; }
    .top { gap: 8px; }
    h1 { font-size: 15px; }
    #q { flex-basis: 100%; order: 3; font-size: 16px; }
    .tabs { order: 4; flex-wrap: nowrap; overflow-x: auto; width: 100%; }
    .tabs button { white-space: nowrap; flex: none; }
    .hint { display: none; }
    article { scroll-margin-top: 150px; }
    nav { top: 0; padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
  }
</style>
</head>
<body>
<header>
  <div class="top">
    <button id="navToggle" class="chip" aria-label="목차 열기">목차</button>
    <h1>도시정비법 찾기</h1>
    <input id="q" type="search" placeholder="검색어 또는 조문 번호 (예: 조합설립 동의, 제35조, 령 30, 2023도16588)" autocomplete="off" autofocus>
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="hint" id="hint"></div>
</header>
<main>
  <nav id="toc" aria-label="목차"></nav>
  <section id="view" tabindex="-1"></section>
</main>
<footer id="foot"></footer>

<script src="data.js"></script>
<script src="cases.js"></script>
<script>
(function () {
  var D = window.LAW_DATA;
  var view = document.getElementById('view'), toc = document.getElementById('toc');
  var q = document.getElementById('q'), tabs = document.getElementById('tabs');
  if (!D) { view.textContent = 'data.js 파일을 찾을 수 없습니다. update-data.ps1 을 실행해 주세요.'; return; }

  var SHORT = { act: '법', decree: '시행령', rule: '시행규칙' };
  var SITE = 'https://www.law.go.kr/';
  var laws = {}, all = [];
  D.laws.forEach(function (law) {
    laws[law.id] = law;
    law.byKey = {};
    law.items.forEach(function (it) {
      if (it.t !== 'a') return;
      it.law = law.id;
      it.label = '제' + it.jo + '조' + (it.br ? '의' + it.br : '');
      it.key = it.jo + '-' + it.br;
      it.text = it.p.map(function (p) { return p[1]; }).join('\n');
      it.hay = (it.title + '\n' + it.text).toLowerCase();
      law.byKey[it.key] = it;
      all.push(it);
    });
  });

  // Precedents: "대법원 2024. 9. 13. 선고 2023도16588 판결" → court / date / case number
  var cases = ((window.CASE_DATA || {}).cases || []).map(function (c) {
    var m = /^(.+?) (\d{4})\. ?(\d{1,2})\. ?(\d{1,2})\.? /.exec(c.info);
    c.date = m ? m[2] + '-' + ('0' + m[3]).slice(-2) + '-' + ('0' + m[4]).slice(-2) : '';
    c.court = m ? m[1] : '';
    c.text = c.gist.join('\n');
    c.hay = (c.name + '\n' + c.info + '\n' + c.text).toLowerCase();
    // Act articles cited under the current numbering: skip "구 …법" (pre-2018 numbering),
    // the decree/rule, and anything decided before the 2018-02-09 full revision took effect.
    c.arts = {};
    if (c.date >= '2018-02-09') {
      var re = /(구 )?(?:도시 및 주거환경정비법|도시정비법)( 시행령| 시행규칙)?(?:\([^)]*\))?((?:[ ,]*(?:및 |또는 )?제\d+조(?:의\d+)?(?: ?제\d+항)?(?: ?제\d+호)?(?: ?(?:본문|단서|전문|후문|각 ?호))?)+)/g, r;
      while ((r = re.exec(c.name + '\n' + c.text))) {
        if (r[1] || r[2]) continue;
        r[3].replace(/제(\d+)조(?:의(\d+))?/g, function (x, jo, br) { c.arts[(+jo) + '-' + (+(br || 0))] = 1; });
      }
    }
    return c;
  }).sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
  function casesFor(a) { return a.law === 'act' ? cases.filter(function (c) { return c.arts[a.key]; }) : []; }

  function caseCard(c, terms) {
    var h = '<article><h2><span class="law">판례</span><span>' + markup(c.name, terms, null) + '</span><span class="sp"></span>' +
      '<a target="_blank" rel="noopener" href="' + SITE + 'precInfoP.do?precSeq=' + c.id + '">판결문 전문 보기</a></h2>' +
      '<p class="note">' + markup(c.info, terms, null) + '</p>';
    if (!c.gist.length) h += '<p class="status">판시사항 요약이 제공되지 않은 판례입니다. 전문 보기에서 확인하세요.</p>';
    c.gist.forEach(function (g) { h += '<p>' + markup(g, terms, null) + '</p>'; });
    return h + '</article>';
  }

  var state = { tab: 'ask', query: '', limit: 40, art: null };
  function toTop() { view.scrollTop = 0; if (getComputedStyle(view).overflowY === 'visible') window.scrollTo(0, 0); }
  var stars = {};
  try { stars = JSON.parse(localStorage.getItem('dosi-stars') || '{}'); } catch (e) {}
  function saveStars() { try { localStorage.setItem('dosi-stars', JSON.stringify(stars)); } catch (e) {} }
  function sid(a) { return a.law + ':' + a.key; }

  function esc(s) { return s.replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function reEsc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  // "제35조", "35", "35의2", "령 30", "규칙 8" → a direct article lookup
  function parseJump(s) {
    var m = /^(법|령|시행령|영|규칙|시행규칙)?\s*제?\s*(\d+)\s*조?\s*(?:의\s*(\d+))?$/.exec(s.trim());
    if (!m) return null;
    var id = !m[1] ? null : m[1] === '법' ? 'act' : /규칙/.test(m[1]) ? 'rule' : 'decree';
    return { law: id, key: (+m[2]) + '-' + (+(m[3] || 0)) };
  }

  // Articles of the decree/rule that cite "법 제N조" for a given act article
  function related(a) {
    if (a.law !== 'act') return [];
    var re = new RegExp('법 ' + reEsc(a.label) + (a.br ? '(?!\\d)' : '(?!의\\d)'));
    return all.filter(function (b) { return b.law !== 'act' && re.test(b.text); });
  }

  function markup(text, terms, lawId) {
    var html = esc(text);
    // same-law article references become clickable; "법 제N조" in decree/rule points at the act
    if (lawId) html = html.replace(/(법 |영 )?제(\d+)조(?:의(\d+))?/g, function (m, pre, jo, br) {
      var target = pre === '법 ' && lawId !== 'act' ? 'act' : pre === '영 ' && lawId === 'rule' ? 'decree' : pre ? null : lawId;
      if (!target || !laws[target].byKey[(+jo) + '-' + (+(br || 0))]) return m;
      return '<span class="ref" data-law="' + target + '" data-key="' + (+jo) + '-' + (+(br || 0)) + '">' + m + '</span>';
    });
    if (terms.length) {
      var re = new RegExp('(' + terms.map(function (t) { return reEsc(esc(t)); }).join('|') + ')(?![^<]*>)', 'gi');
      html = html.replace(re, '<mark>$1</mark>');
    }
    return html;
  }

  function card(a, terms, showRel) {
    var law = laws[a.law];
    var h = '<article id="a-' + a.law + '-' + a.key + '"><h2><span class="law">' + SHORT[a.law] + '</span>' +
      '<span>' + markup(a.title, terms, null) + '</span><span class="sp"></span>' +
      '<button data-star="' + sid(a) + '">' + (stars[sid(a)] ? '★ 즐겨찾기 해제' : '☆ 즐겨찾기') + '</button>' +
      '<a target="_blank" rel="noopener" href="' + SITE + law.path + '/' + encodeURIComponent(a.label) + '">원문 보기</a></h2>';
    a.p.forEach(function (p) {
      var note = /^\[(본조|제목|전문|시행일|종전|법률|대통령령)/.test(p[1]);
      h += '<p class="lv' + p[0] + (note ? ' note' : '') + '">' + markup(p[1], terms, a.law) + '</p>';
    });
    if (showRel) {
      var cs = casesFor(a);
      if (cs.length) {
        h += '<div class="rel"><b>이 조문을 다룬 판례</b><button class="chip" data-cases="' + a.key + '">' + cs.length + '건 보기</button></div>';
      }
      var rel = related(a);
      if (rel.length) {
        h += '<div class="rel"><b>이 조문을 인용하는 하위법령</b>' + rel.map(function (b) {
          return '<button class="chip ref" data-law="' + b.law + '" data-key="' + b.key + '">' + SHORT[b.law] + ' ' + esc(b.title) + '</button>';
        }).join('') + '</div>';
      }
    }
    return h + '</article>';
  }

  // ---- 질문 탭: 일상 말로 쓴 질문 → 관련 조문·판례 찾기 (+ Claude 로그인 시 AI 답변) ----
  var STOP = ['있나', '있는', '있을', '있습', '있어', '없나', '없는', '없을', '없습', '없어', '하나요', '하는', '하면', '하려', '해야', '합니', '되나', '되는', '되면', '됩니', '어떻', '어떤', '무엇', '언제', '누가', '누구', '얼마', '알려', '궁금', '가능', '싶은', '싶어', '싶습', '경우', '관련', '대해', '대한', '그리고', '그런데', '그러면', '그래서', '만약', '우리', '저희', '제가', '내가', '저는', '나는', '같은', '이런', '그런', '받을', '받나', '받아', '혹시', '지금', '현재', '정도', '어디', '무슨', '인가', '인지', '입니', '이게', '그게', '해도', '해서', '했는', '한테', '할수', '될수', '뭔가', '뭐가', '뭐를', '어느', '아니', '그냥', '정말', '너무', '많이', '또는', '이후', '이전', '때문'];
  var SUFFIX = ['에서는', '으로는', '에게서', '이라는', '이라고', '인가요', '인데요', '입니까', '에서', '에게', '한테', '으로', '까지', '부터', '처럼', '보다', '이나', '이란', '라는', '라고', '하고', '이면', '인데', '이고', '은', '는', '이', '가', '을', '를', '의', '에', '로', '와', '과', '도', '만', '요'];
  // 일상 표현 → 법령·판결문에서 쓰는 말
  var SYN = [
    [/쫓겨|쫓아|나가야|비워|명도|퇴거|강제집행/, ['인도', '사용하거나 수익', '이주', '퇴거', '손실보상']],
    [/보상/, ['손실보상', '보상금', '수용']],
    [/세입자|임차인|전세|월세|세 들어/, ['세입자', '임차인', '주거이전비', '임대차', '전세권']],
    [/상가|가게|영업|장사|점포/, ['영업손실', '휴업', '상가', '부대시설']],
    [/현금청산|청산/, ['분양신청을 하지 아니한', '청산금', '현금으로 청산', '손실보상에 관한 협의']],
    [/분양신청.*(안|않|못)|신청을? ?(안|못)|신청 ?기간.*(지나|놓)/, ['분양신청을 하지 아니한', '현금으로 청산', '손실보상에 관한 협의', '분양신청기간']],
    [/분담금|추분|추가로 내|돈을 더/, ['분담금', '추산액', '정비사업비', '청산금']],
    [/입주권|딱지|분양권|새 아파트를 받/, ['분양받을 권리', '조합원의 자격', '분양대상', '관리처분계획']],
    [/해임|자르|교체|물러나|몰아내/, ['해임', '조합임원']],
    [/조합장|임원|이사(?!비|를? ?가|하)|감사/, ['조합임원', '조합의 임원', '결격사유']],
    [/총회/, ['총회의 의결', '총회의 소집']],
    [/동의율|동의서|몇 ?프로|퍼센트|몇 ?%|과반/, ['토지등소유자의 동의', '동의', '4분의 3', '과반수']],
    [/안전진단/, ['재건축진단']],
    [/시공사|건설사|건설회사/, ['시공자', '계약의 방법', '경쟁입찰']],
    [/뇌물|금품|향응|돈봉투|홍보요원|접대/, ['금품', '향응', '벌칙', '행위제한']],
    [/정보공개|자료를? ?안|열람|회계|장부|공개/, ['관련 자료의 공개', '열람', '복사']],

      Object.keys(prev).forEach(function (t) { if (!terms[t]) terms[t] = prev[t]; });
    }
    var m = { q: text, terms: terms, ai: '', note: '', status: 'AI 답변을 준비하는 중…', arts: rank(all, terms, 'a', 6), cases: rank(cases, terms, 'c', 6) };
    state.chat.push(m);
    var box = document.getElementById('askBox');
    if (box) box.value = '';
    renderAsk();
    var el = document.getElementById('msg-' + (state.chat.length - 1));
    if (el) el.scrollIntoView({ block: 'start' });
    runAi(m, history);
  }
  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'askForm') return;
    e.preventDefault();
    ask(document.getElementById('askBox').value);
  });
  document.addEventListener('keydown', function (e) {
    if (e.target.id === 'askBox' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(e.target.value); }
  });

  function renderTabs() {
    var list = [['ask', '질문'], ['act', '법'], ['decree', '시행령'], ['rule', '시행규칙'], ['case', '판례'], ['star', '★ 즐겨찾기']];
    tabs.innerHTML = list.map(function (t) {
      return '<button data-tab="' + t[0] + '" aria-pressed="' + (state.tab === t[0]) + '">' + t[1] + '</button>';
    }).join('');
  }

  function renderToc() {
    var law = laws[state.tab] || (state.tab === 'ask' ? laws.act : null);
    if (state.tab === 'case') {
      var byYear = {};
      cases.forEach(function (c) { var y = c.date.slice(0, 4) || '기타'; byYear[y] = (byYear[y] || 0) + 1; });
      toc.innerHTML = '<div class="ch">판례 ' + cases.length + '건 · 선고연도</div>' +
        Object.keys(byYear).sort().reverse().map(function (y) {
          return '<a href="#" data-year="' + y + '">' + y + '년 (' + byYear[y] + '건)</a>';
        }).join('');
      return;
    }
    if (!law) {
      var s = all.filter(function (a) { return stars[sid(a)]; });
      toc.innerHTML = '<div class="ch">즐겨찾기 ' + s.length + '건</div>' + s.map(function (a) {
        return '<a href="#" data-law="' + a.law + '" data-key="' + a.key + '">' + SHORT[a.law] + ' ' + esc(a.title) + '</a>';
      }).join('');
      return;
    }
    toc.innerHTML = law.items.map(function (it) {
      if (it.t === 'h') return '<div class="ch">' + esc(it.text) + '</div>';
      return '<a href="#" data-law="' + it.law + '" data-key="' + it.key + '" title="' + esc(it.title) + '">' +
        (stars[sid(it)] ? '<span class="star">★ </span>' : '') + esc(it.title) + '</a>';
    }).join('');
  }

  function render() {
    renderTabs();
    var raw = state.query.trim();
    if (state.tab === 'ask' && !raw) { renderAsk(); renderToc(); return; }
    var html = '', status = '';
    var jump = raw && parseJump(raw);
    if (jump) {
      var ids = jump.law ? [jump.law] : ['act', 'decree', 'rule'];
      var hits = ids.map(function (id) { return laws[id].byKey[jump.key]; }).filter(Boolean);
      status = hits.length ? '조문 번호로 찾은 결과 ' + hits.length + '건' : '해당 번호의 조문이 없습니다.';
      html = hits.map(function (a) { return card(a, [], true); }).join('');
    } else if (state.tab === 'case') {
      var cterms = raw ? raw.toLowerCase().split(/\s+/).filter(Boolean) : [];
      var cres = cases.filter(function (c) {
        if (state.art && !c.arts[state.art]) return false;
        return cterms.every(function (t) { return c.hay.indexOf(t) >= 0; });
      });
      var artA = state.art && laws.act.byKey[state.art];
      status = (artA ? '법 ' + artA.title + '을(를) 현행 조문 번호로 다룬 판례 ' : raw ? '“' + raw + '” 판례 검색 결과 ' : '도시정비법 관련 판례 ') + cres.length + '건 (최근 선고순)' +
        (artA ? ' · 2018. 2. 9. 전부개정 시행 후 선고된 판례의 판시사항 기준이라, 그 이전 판례는 검색어로 찾으세요.' : '');
      html = cres.slice(0, state.limit).map(function (c) { return caseCard(c, cterms); }).join('');
      if (cres.length > state.limit) html += '<button class="chip more" id="more">결과 더 보기 (' + (cres.length - state.limit) + '건 남음)</button>';
      if (raw) {
        var nLaw = all.filter(function (a) { return cterms.every(function (t) { return a.hay.indexOf(t) >= 0; }); }).length;
        if (nLaw) html = '<button class="chip" data-scope="act" style="margin-bottom:10px">조문에서도 ' + nLaw + '건 → 보기</button>' + html;
      }
    } else if (raw) {
      var terms = raw.toLowerCase().split(/\s+/).filter(Boolean);
      var res = all.filter(function (a) { return terms.every(function (t) { return a.hay.indexOf(t) >= 0; }); });
      var nCase = cases.filter(function (c) { return terms.every(function (t) { return c.hay.indexOf(t) >= 0; }); }).length;
      if (nCase) html = '<button class="chip" data-scope="case" style="margin-bottom:10px">판례에서도 ' + nCase + '건 → 보기</button>';
      // title matches first, then act → decree → rule in article order
      var rank = function (a) { return terms.every(function (t) { return a.title.toLowerCase().indexOf(t) >= 0; }) ? 0 : 1; };
      res = res.map(function (a, i) { return [rank(a), i, a]; }).sort(function (x, y) { return x[0] - y[0] || x[1] - y[1]; }).map(function (x) { return x[2]; });
      var count = {}; res.forEach(function (a) { count[a.law] = (count[a.law] || 0) + 1; });
      status = res.length
        ? '“' + raw + '” 검색 결과 ' + res.length + '개 조문 (법 ' + (count.act || 0) + ' · 시행령 ' + (count.decree || 0) + ' · 시행규칙 ' + (count.rule || 0) + ')'
        : '“' + raw + '”에 해당하는 조문이 없습니다. 띄어쓰기를 바꾸거나 더 짧은 낱말로 검색해 보세요.';
      html += res.slice(0, state.limit).map(function (a) { return card(a, terms, false); }).join('');
      if (res.length > state.limit) html += '<button class="chip more" id="more">결과 더 보기 (' + (res.length - state.limit) + '건 남음)</button>';
    } else if (state.tab === 'star') {
      var s = all.filter(function (a) { return stars[sid(a)]; });
      status = s.length ? '즐겨찾기한 조문 ' + s.length + '건' : '즐겨찾기한 조문이 없습니다. 조문 제목 옆의 ☆ 즐겨찾기를 누르면 여기에 모입니다.';
      html = s.map(function (a) { return card(a, [], true); }).join('');
    } else {
      var law = laws[state.tab];
      status = law.name + ' ' + law.meta;
      html = law.items.map(function (it) {
        return it.t === 'h' ? '<h3 class="status" style="margin:18px 0 8px;font-size:14px">' + esc(it.text) + '</h3>' : card(it, [], true);
      }).join('');
    }
    view.innerHTML = '<div class="status">' + esc(status) + '</div>' + html;
    renderToc();
  }

  function go(lawId, key) {
    state.tab = lawId; state.query = ''; q.value = ''; state.art = null;
    render();
    toc.classList.remove('open');
    var el = document.getElementById('a-' + lawId + '-' + key);
    if (el) el.scrollIntoView({ block: 'start' });
    var link = toc.querySelector('a[data-law="' + lawId + '"][data-key="' + key + '"]');
    if (link) { link.classList.add('on'); link.scrollIntoView({ block: 'center' }); }
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-tab],[data-key],[data-star],[data-cases],[data-scope],[data-year],[data-caseq],[data-stop],[data-ex],#more,#navToggle');
    if (!t) { toc.classList.remove('open'); return; }
    if (t.id === 'navToggle') { toc.classList.toggle('open'); return; }
    if (t.id === 'more') { state.limit += 40; render(); return; }
    if (t.dataset.ex) { ask(t.dataset.ex); return; }
    if (t.dataset.stop) { var sm = state.chat[+t.dataset.stop]; if (sm && sm.ctl) sm.ctl.abort(); return; }
    if (t.dataset.caseq) { state.tab = 'case'; state.art = null; state.query = q.value = t.dataset.caseq; state.limit = 40; render(); toTop(); return; }
    if (t.dataset.tab) { state.tab = t.dataset.tab; state.query = ''; q.value = ''; state.limit = 40; state.art = null; render(); toTop(); return; }
    if (t.dataset.cases) { state.tab = 'case'; state.art = t.dataset.cases; state.query = ''; q.value = ''; state.limit = 40; render(); toTop(); return; }
    if (t.dataset.scope) { state.tab = t.dataset.scope; state.art = null; state.limit = 40; render(); toTop(); return; }
    if (t.dataset.year) { e.preventDefault(); state.art = null; state.query = q.value = t.dataset.year + '.'; state.limit = 40; render(); toTop(); toc.classList.remove('open'); return; }
    if (t.dataset.star) {
      if (stars[t.dataset.star]) delete stars[t.dataset.star]; else stars[t.dataset.star] = 1;
      saveStars();
      var top = view.scrollTop, wy = window.scrollY; render(); view.scrollTop = top; window.scrollTo(0, wy);
      return;
    }
    if (t.dataset.key) { e.preventDefault(); go(t.dataset.law, t.dataset.key); }
  });

  var timer;
  q.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(function () { state.query = q.value; state.limit = 40; state.art = null; render(); toTop(); }, 120);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== q && e.target.id !== 'askBox') { e.preventDefault(); q.focus(); q.select(); }
  });

  document.getElementById('hint').textContent =
    '낱말 여러 개는 띄어 써서 모두 포함된 조문을 찾습니다. 본문의 점선 밑줄 조문 번호를 누르면 그 조문으로 이동합니다.';
  document.getElementById('foot').innerHTML =
    '조문 출처: <a target="_blank" rel="noopener" href="' + SITE + '">국가법령정보센터</a> · ' + D.fetched + ' 기준 현행 본문 (부칙·별표·서식 제외) · ' +
    D.laws.map(function (l) { return esc(SHORT[l.id] + ' ' + l.meta); }).join(' · ') +
    (cases.length ? ' · 판례 ' + cases.length + '건(사건명·판시사항, ' + window.CASE_DATA.fetched + ' 수집)' : '') + ' · 법적 판단이 필요한 경우 반드시 원문과 최신 개정 여부를 확인하세요.';
  render();
})();
</script>
</body>
</html>
